# Lint + format + type config for the diagram skill's Python. Its tests, their pytest configuration and the
# coverage floor over them are gone (feature 449 FR-001b and T213, the GM 2026-11-10: "Yes delete everything
# except that group, please."); `make quick` runs ruff's outright-error check over what Python is left.
#
# Principle X (feature 005, GM-directed 2026-07-13): the Mode B engine (settlement.py,
# waterfields.py) is brought to FULL compliance - no grace period. ruff lint +
# format apply now; typing is pyrefly with the mypy-strict rule set (feature 142; the per-module
# mypy ratchet that preceded it is fully retired - every engine module is strict).

# ---- ruff (lint + format) ----------------------------------------------------------------
[tool.ruff]
target-version = "py314"
# The engine uses intentionally long, descriptive single-line check calls; 200 keeps `ruff format`
# from wrapping them (only ~17 lines exceed it) while still normalizing spacing/comments.
line-length = 200
# BOTH POOL TREES. A map generator is a script formatted by its own author, not engine source -
# and for the FROZEN tree this is load-bearing rather than stylistic (feature 161): those 18
# exhibits are committed write-once, so `ruff format .` and `ruff check --fix .` - which the
# gate runs, in place, without failing - would silently rewrite artifacts that can never be
# faithfully regenerated. Measured 2026-08-30 with the tree named but this list not yet
# updated: 18 files would be reformatted and 16 lint errors auto-fixed. `legacy-hand-authored-pool`
# does not match the pattern `pool`, so the new tree had to be named here explicitly.
# THE FENCE (feature 329, carried from the retired root ruff.toml). The project moved to the repository root, so a
# root `ruff format .` / `ruff check --fix .` - which the gate runs, in place, without failing - now starts here. The
# old root config was `exclude = ["*"]` for exactly that reason: on 2026-08-17 a root `ruff format .` reformatted 19
# files of RETIRED migration tooling under specs/ (features 022-116), frozen artifacts nobody works on, and it was
# caught only because `git status` printed paths starting with `../../../`. Everything at the root that the skill
# directory did not hold is named here, so a root run lints exactly what the skill directory's run did (research.md
# R3 compares the two file lists) and touches nothing no package has adopted. tests/tooling/test_lint_scope.py pins it.
extend-exclude = [
    "pool", "legacy-hand-authored-pool",
    "specs", "scripts", "tests/hooks", ".clones", ".claude", ".specify", "docs",
]

[tool.ruff.lint]
# PLR0915 IS THE FUNCTION-LENGTH CAP (feature 370; constitution Principle X clause 12), held - with its suppressions - by
# scripts/gates/check-function-cap.py, which runs first in `make static` and `make quick` and before every push.
select = ["E9", "F63", "F7", "F82"]  # outright errors only: the last automatic check on the Python still being edited as ports land (feature 449 FR-001b)
ignore = []   # long descriptive lines are house style; the formatter caps wrapping via line-length

[tool.ruff.lint.pylint]
# 100 STATEMENTS A FUNCTION (the GM, 2026-10-10). Why 100 and not ruff's and pylint's default 50: in a survey of 1,209
# public repositories that set max-statements (GitHub code search, 2026-10-10), 100 was the second most common value -
# 131 of 1,209 - and the most common one chosen over the default, which many configs carry only because
# `pylint --generate-rcfile` writes it (specs/370-function-length-gate/research.md R1). At 100 the cap failed 12 of this
# project's functions on the day it landed, each split rather than exempted (research.md R2).
max-statements = 100

[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
# Preserve the existing quote style: the SVG f-strings use single-outer/double-inner
# (f'<rect fill="{c}"/>'), so leaving quotes as-authored avoids needless churn/risk.
quote-style = "preserve"

# ---- the namespace portion -------------------------------------------------------------------
# `l7r` is a PEP 420 namespace portion (feature 119) - no `__init__.py`, deliberately, so that the
# webapp's `l7r.app` and this project's `l7r.diagram.*` share one parent package. Do NOT "fix" this by
# adding `l7r/__init__.py` - that silently hides the webapp's portion.
#
# The pyrefly configuration that stood here was deleted by feature 449 T222: its last two checked files
# (`pool_index.py`, `poolmaps.py`) were deleted, and nothing in the Makefile runs pyrefly.
