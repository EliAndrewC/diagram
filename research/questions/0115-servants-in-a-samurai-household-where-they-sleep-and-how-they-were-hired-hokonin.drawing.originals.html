<li data-orig="kotobank-nagayamon#1">original: 「武家屋敷などの前面に家臣・下男などを住まわせるための長屋を設け、その一部をあけて門としたもの。屋根は長屋と一つづきとなる。」</li>
<li data-orig="fukui-bushi-jutaku-5#1">original: 「通りに面した建物の壁は奉公人が暮らす長屋などであったことがわかり」</li>
<li data-orig="kotobank-bukeyashiki-7#1">original: 「侍衆の屋敷になると，住込みの家臣や奉公人が少ないところから，長屋のかわりに塀を設けるなど家囲いも簡略なものになり」</li>
