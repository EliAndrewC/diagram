<li data-orig="sanson-jawiki#1">original: 「散居村（さんきょそん）は、耕地など広大な土地の間に民家（孤立荘宅）が散らばって点在する集落形態。」</li>
<li data-orig="sanson-jawiki#2">original: 「一般的には散村（さんそん）と呼ばれる。」</li>
<li data-orig="mencius-14-21-chinakongzi#1">original: 「山径之蹊间，介然用之而成路；为间不用，则茅塞之矣。」</li>
<li data-orig="tang-code-juan26-wikisource#1">original: 「諸侵巷街、阡陌者，杖七十。若種植墾食者，笞五十。各令復故。雖種植，無所妨廢者，不坐。」</li>
<li data-orig="tang-code-juan26-wikisource#2">original: 「「侵巷街、阡陌」，謂公行之所，若許私侵，便有所廢，故杖七十。」</li>
<li data-orig="tang-code-juan26-wikisource#3">original: 「若巷陌寬閑，雖有種植，無所妨廢者，不坐。」</li>
