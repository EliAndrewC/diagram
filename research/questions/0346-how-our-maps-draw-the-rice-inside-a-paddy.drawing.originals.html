<li data-orig="kubota-transplanting#2">original: 「これによって株の間隔が揃い、稲にむらなく日が当たり、風通しも良くなり、除草作業の能率も上がって収量が増えました。」</li>
<li data-orig="maff-kodomo-kabuma#1">original: 「苗がうまく育っていれば、畝間（うねま）も株間（かぶま）も30cmくらいにして 植えます。 草丈（くさたけ）が短く、まだ株の分かれが進んでいない苗が多い場合は、 株間を20～25cmくらいにつめて植えると良いといわれています。」</li>
