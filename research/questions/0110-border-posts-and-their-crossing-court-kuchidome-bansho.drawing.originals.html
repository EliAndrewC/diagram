<li data-orig="bunka-nuruyu-bansho#1">original: 「仙台藩の口留番所の一つである。」</li>
<li data-orig="bunka-nuruyu-bansho#2">original: 「秋田藩領に出る口を扼する山峽の要衝であって」</li>
<li data-orig="bunka-nuruyu-bansho#3">original: 「街道を遮って表門を構え、その正面に檢断所を置き、檢断所の向って右奥に役宅がある。」</li>
<li data-orig="bunka-nuruyu-bansho#4">original: 「街道はいま番所跡敷地の外を通っているが、もと表門より門に入り檢断所の前を過っていた。」</li>
<li data-orig="bunka-nuruyu-bansho#5">original: 「役宅は桁行２３．１９メートル、梁行１１．８６メートル、向って右に土間、左に居間を配する一般民家の形式をとつているが、書院造の座敷を具えた堂々たる建物である。」</li>
