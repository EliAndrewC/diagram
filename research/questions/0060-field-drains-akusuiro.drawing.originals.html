<li data-orig="maff-nogyoyosui-suiden-6#1">original: 「特に、農業用水が不足する干ばつ時には、山地流域から流出する水が全て農業用水に取入れられるばかりでなく、一つの用水地区から河川に還元流入する排水も下流の用水によって全量使用されることになり、流域レベルで水資源は徹底的に利用された。」</li>
<li data-orig="kaogongji-wikisource#1">original: 「匠人為溝洫。耜廣五寸，二耜為耦。一耦之伐，廣尺深尺謂之畎。田首倍之，廣二尺、深二尺謂之遂。」</li>
<li data-orig="nanjing-chengqiang-zhwiki#1">original: 「水闸通过预埋在城墙墙基内的涵管，将玄武湖水引入城内的珍珠河」</li>
<li data-orig="nanjing-chengqiang-zhwiki#2">original: 「西水关是内秦淮河出城的水门，因此三山门又称“水西门”」</li>
