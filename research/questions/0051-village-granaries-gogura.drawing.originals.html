<li data-orig="kotobank-gogura#1">original: 「江戸時代、年貢米の保管、または凶作に備えての貯穀のためなどに村々に設置された蔵。」</li>
<li data-orig="kotobank-gogura#2">original: 「すべての村にあったわけではなく数か村が共同使用をしたり、名主の土蔵を準用することもあった。」</li>
<li data-orig="yabu-yamaji-gogura-2#1">original: 「山路の郷蔵は、昔の旧県道に扉をむけて一棟だけ立っています。」</li>
<li data-orig="yabu-yamaji-gogura-2#2">original: 「瓦葺2階建ての建物で、正面340センチメートル、側面290センチメートル、屋根までの高さは500センチメートルあります。」</li>
<li data-orig="kotobank-gogura-3#1">original: 「郷蔵は村居の内に附、多分畑地に立る明屋館等あれば、やしきにも立る事也」</li>
