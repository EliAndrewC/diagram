<li data-orig="kotobank-sakaya-2#1">original: 「しかし18世紀前半（享保末年以降）に米価が下落するという事態に直面し，ここに幕初以来の在方酒造業の禁止という祖法を捨て，農村酒造業を積極的に奨励するという政策転換が打ち出された。」</li>

<li data-orig="bunka-yachiya-sakagura#2">original: 「南北に長い敷地中央に建つ道具蔵の北側にあり，主屋とほぼ同時期のものと思われ」</li>
