# buildspec/merge.yml - the merge gate (gm-assistant-merge, concurrency 1). Identical to check.yml
# except MODE, which makes run.sh fast-forward-push the verified merge result to main and delete
# the mailbox. A non-fast-forward rejection fails the build ("main moved; re-run") - no retry.
version: 0.2
# The generation cache, identical to check.yml's - see that file for what each line is and, more
# importantly, for what is deliberately absent (`*.png`, `*.html`) and why adding either would be a
# defect rather than an improvement. Kept in both files rather than shared because a buildspec is
# passed whole as `buildspecOverride`; if these two ever disagree,
# `tests/tooling/ci/test_cache.py` fails.
cache:
  paths:
    - 'repo/.claude/skills/diagram/.gencache/*/*.json'
    - 'repo/.claude/skills/diagram/.gencache/*/*.svg'
    - 'repo/.claude/skills/diagram/.gencache/*/coverage.*'
    - 'repo/.claude/skills/diagram/.gencache/ast/**/*'
    - 'repo/.claude/skills/diagram/.gencache/rolls/**/*'
    # The hooks-test freshness state (feature 177) - identical to check.yml's, see there for why each
    # line and why `run.sh`'s restore detection had to change first. `test_cache.py` fails if the two
    # buildspecs ever disagree.
    - 'repo/.git/gate-green-hooks'
    - 'repo/.git/hooks-test/**/*'
env:
  variables:
    MODE: merge
phases:
  install:
    commands:
      - git clone -q --filter=blob:none "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}" bootstrap
      - git -C bootstrap fetch -q origin "refs/heads/${MAILBOX}:refs/remotes/origin/${MAILBOX}"
      - git -C bootstrap checkout -q "$GIT_SHA" -- buildspec/run.sh
  build:
    commands:
      - bash bootstrap/buildspec/run.sh
