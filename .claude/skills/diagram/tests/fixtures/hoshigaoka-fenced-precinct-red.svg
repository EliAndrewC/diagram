<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 116 600 1236" font-family="Georgia, 'Times New Roman', serif">
  <!-- ============================================================ -->
  <!-- Hoshigaoka Country Shrine - top-down diagrammatic plan          -->
  <!-- North at top; the village lies north, the approach rises from the south. -->
  <!-- 3 px = 1 ft. The country shrine's program: buildings/programs.md -->
  <!-- THE SHEET MATCHES THE VILLAGE MAP (feature 257): the hall's     -->
  <!-- center is map (392, 1074) of hoshigaoka.json; 6 sheet px = 1   -->
  <!-- map px. What the map shows here is the hall, seven arches 30 ft -->
  <!-- apart from 20 ft in front of it (the GM's seven-arch avenue,    -->
  <!-- 2026-09-26), the shrine's well 108 ft behind, and swept ground - no -->
  <!-- grove, no burial ground, no lane. Nothing else is drawn.        -->
  <!-- ============================================================ -->
  <defs>
    <!-- Swept gravel of the shrine precinct (keidai): pale, with faint rake lines -->
    <pattern id="keidai-gravel" patternUnits="userSpaceOnUse" width="16" height="16">
      <rect width="16" height="16" fill="#E6DCC4"/>
      <line x1="0" y1="4" x2="16" y2="4" stroke="#D2C4A4" stroke-width="0.5"/>
      <line x1="0" y1="12" x2="16" y2="12" stroke="#D2C4A4" stroke-width="0.5"/>
      <circle cx="9" cy="8" r="0.5" fill="#C9B884"/>
    </pattern>
    <!-- The swept clearing around the precinct: bare earth kept clear of scrub (the map's clearing) -->
    <pattern id="swept-earth" patternUnits="userSpaceOnUse" width="18" height="18">
      <rect width="18" height="18" fill="#E9DDBF"/>
      <circle cx="5" cy="7" r="0.5" fill="#C9B884"/>
      <circle cx="13" cy="14" r="0.5" fill="#C9B884"/>
    </pattern>
    <!-- Kitchen garden stipple -->
    <pattern id="garden-stipple" patternUnits="userSpaceOnUse" width="14" height="14">
      <rect width="14" height="14" fill="#BFCFA0"/>
      <circle cx="3" cy="3" r="0.8" fill="#7A8C5C"/>
      <circle cx="10" cy="9" r="0.8" fill="#7A8C5C"/>
    </pattern>
    <!-- The kitchen's earthen floor -->
    <pattern id="doma-earth" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#CDB07A"/>
      <circle cx="3" cy="5" r="0.5" fill="#A88E58"/><circle cx="9" cy="10" r="0.5" fill="#A88E58"/>
    </pattern>
  </defs>

  <!-- Outer land: the parchment, then the swept clearing the map records around the shrine, to the frame's edge -->
  <rect x="0" y="0" width="900" height="1400" fill="#EFE3C2"/>
  <rect x="140" y="116" width="600" height="1236" fill="url(#swept-earth)"/>

  <!-- Title block -->
  <text x="152" y="150" text-anchor="start" font-size="26" font-weight="bold" fill="#3A2E1C">Hoshigaoka Country Shrine</text>
  <text x="152" y="170" text-anchor="start" font-size="12" font-style="italic" fill="#6B4F2A">the shrine of Hoshigaoka village district</text>

  <!-- Scale bar (3 px = 1 ft), bottom-left, clear of the title -->
  <g>
    <g stroke="#3A2E1C">
      <line x1="166" y1="1310" x2="256" y2="1310" stroke-width="2"/>
      <line x1="166" y1="1305" x2="166" y2="1315" stroke-width="2"/>
      <line x1="256" y1="1305" x2="256" y2="1315" stroke-width="2"/>
      <line x1="211" y1="1307" x2="211" y2="1313" stroke-width="1"/>
    </g>
    <text x="211" y="1326" text-anchor="middle" font-size="10" fill="#3A2E1C">30 ft</text>
    <text x="211" y="1337" text-anchor="middle" font-size="8" font-style="italic" fill="#5C4830">(3 px = 1 ft)</text>
  </g>

  <!-- THE PRECINCT: swept gravel inside the fence (140 x 99 ft), closing 15 ft behind the sanctuary as a shrine's does; the well the map
       puts 108 ft behind the hall stands OUTSIDE it on the axis, reached from the village side (the size-audit of 2026-09-20) -->
  <rect x="230" y="335" width="420" height="297" fill="url(#keidai-gravel)" id="precinct"/>
  <!-- The fence (tamagaki): a low paling all round, broken at the south for the arch, at the west for the household's service way
       (the doma's yard, the privy, the kitchen garden) and its water way to the well outside, and at the east for the dwelling's door -->
  <g id="fence" stroke="#7A6A4A" stroke-width="2" fill="none" stroke-linecap="square">
    <line x1="230" y1="335" x2="650" y2="335"/>
    <line x1="230" y1="335" x2="230" y2="350"/>
    <line x1="230" y1="368" x2="230" y2="548"/>
    <line x1="230" y1="566" x2="230" y2="632"/>
    <line x1="650" y1="335" x2="650" y2="548"/>
    <line x1="650" y1="566" x2="650" y2="632"/>
    <line x1="230" y1="632" x2="416" y2="632"/>
    <line x1="464" y1="632" x2="650" y2="632"/>
  </g>

  <!-- The approach (sando): a 10 ft gravel way from the outermost of the seven arches to the hall's front step - 206 ft, through the avenue -->
  <rect x="425" y="572" width="30" height="618" fill="#D9CFB4" stroke="#C4B48E" stroke-width="0.8" id="approach"/>

  <!-- The arch (torii) over the approach where the way crosses the fence, 20 ft in front of the hall's face (the innermost of the map's seven torii): two posts and a lintel, 15 ft outer span -->
  <rect x="417" y="620" width="46" height="24" fill="none" id="arch"/>
  <g fill="#A03020" stroke="#6B2A18" stroke-width="0.8">
    <rect x="420" y="624" width="4" height="20"/>
    <rect x="456" y="624" width="4" height="20"/>
    <rect x="417" y="620" width="46" height="3"/>
    <rect x="421" y="627" width="38" height="2"/>
  </g>
  <!-- The six outer arches (all marked id="arch": the checks find a sheet's arches by that id, and matches_map pairs each with the map's) down the avenue (the GM's seven, 2026-09-26), 30 ft apart as the map marches them, the same 15 ft span -->
  <rect x="417" y="710" width="46" height="24" fill="none" id="arch"/>
  <g fill="#A03020" stroke="#6B2A18" stroke-width="0.8">
    <rect x="420" y="714" width="4" height="20"/>
    <rect x="456" y="714" width="4" height="20"/>
    <rect x="417" y="710" width="46" height="3"/>
    <rect x="421" y="717" width="38" height="2"/>
  </g>
  <rect x="417" y="800" width="46" height="24" fill="none" id="arch"/>
  <g fill="#A03020" stroke="#6B2A18" stroke-width="0.8">
    <rect x="420" y="804" width="4" height="20"/>
    <rect x="456" y="804" width="4" height="20"/>
    <rect x="417" y="800" width="46" height="3"/>
    <rect x="421" y="807" width="38" height="2"/>
  </g>
  <rect x="417" y="890" width="46" height="24" fill="none" id="arch"/>
  <g fill="#A03020" stroke="#6B2A18" stroke-width="0.8">
    <rect x="420" y="894" width="4" height="20"/>
    <rect x="456" y="894" width="4" height="20"/>
    <rect x="417" y="890" width="46" height="3"/>
    <rect x="421" y="897" width="38" height="2"/>
  </g>
  <rect x="417" y="980" width="46" height="24" fill="none" id="arch"/>
  <g fill="#A03020" stroke="#6B2A18" stroke-width="0.8">
    <rect x="420" y="984" width="4" height="20"/>
    <rect x="456" y="984" width="4" height="20"/>
    <rect x="417" y="980" width="46" height="3"/>
    <rect x="421" y="987" width="38" height="2"/>
  </g>
  <rect x="417" y="1070" width="46" height="24" fill="none" id="arch"/>
  <g fill="#A03020" stroke="#6B2A18" stroke-width="0.8">
    <rect x="420" y="1074" width="4" height="20"/>
    <rect x="456" y="1074" width="4" height="20"/>
    <rect x="417" y="1070" width="46" height="3"/>
    <rect x="421" y="1077" width="38" height="2"/>
  </g>
  <rect x="417" y="1160" width="46" height="24" fill="none" id="arch"/>
  <g fill="#A03020" stroke="#6B2A18" stroke-width="0.8">
    <rect x="420" y="1164" width="4" height="20"/>
    <rect x="456" y="1164" width="4" height="20"/>
    <rect x="417" y="1160" width="46" height="3"/>
    <rect x="421" y="1167" width="38" height="2"/>
  </g>

  <!-- The shrine's well - its one water point - 108 ft behind the hall on the axis, where the village map sites it, outside the fence -->
  <rect x="433" y="169" width="15" height="15" fill="#9C8C70" stroke="#5C4830" stroke-width="1.2" id="well"/>
  <circle cx="440.5" cy="176.5" r="4" fill="#3A3A34"/>
  <text x="464" y="180" text-anchor="start" font-size="7" font-style="italic" fill="#4A4640">well</text>

  <!-- THE HALL AND DWELLING under one roof, at the footprint the village map draws (60 x 48 ft), hall and dwelling END TO END
       along the ridge as at Kaie-ji: the kitchen's earthen floor at the west end, the villagers' hall in the center facing the
       approach, the monk's rooms and the writing room at the east end; the hall's rear faces the sanctuary with nothing between -->
  <rect x="350" y="428" width="180" height="144" fill="#DDB87A" stroke="#5A3F1E" stroke-width="2" id="hall"/>
  <!-- the doma: the kitchen's earthen floor, drawn as earth -->
  <rect x="351" y="429" width="47" height="142" fill="url(#doma-earth)"/>
  <g stroke="#6B4F2A" stroke-width="1" stroke-dasharray="4 3" fill="none">
    <line x1="398" y1="428" x2="398" y2="572"/>
    <line x1="482" y1="428" x2="482" y2="572"/>
    <line x1="482" y1="536" x2="530" y2="536"/>
    <line x1="518" y1="536" x2="518" y2="572"/>
    <line x1="398" y1="470" x2="482" y2="470"/>
  </g>
  <!-- the altar bay: the hall's rear 14 ft against the sanctuary wall, the worship floor 28 x 34 ft before it (a village hall's measured depth) -->
  <!-- the villagers' hall: its raised step on the approach, the altar band at its rear toward the sanctuary -->
  <rect x="398" y="572" width="84" height="6" fill="#E8D2A8" stroke="#6B4F2A" stroke-width="0.8"/>
  <rect x="416" y="432" width="48" height="5" fill="#6B2A18"/>
  <rect x="434" y="440" width="12" height="6" fill="#A03020" stroke="#6B2A18" stroke-width="0.6"/>
  <text x="440" y="504" text-anchor="middle" font-size="11" font-weight="bold" fill="#3A2E1C">hall and dwelling</text>
  <!-- the dwelling end -->
  <text x="506" y="470" text-anchor="middle" font-size="7.5" font-style="italic" fill="#5C4830">the monk's</text>
  <text x="506" y="480" text-anchor="middle" font-size="7.5" font-style="italic" fill="#5C4830">rooms</text>
  <text x="500" y="552" text-anchor="middle" font-size="6" font-style="italic" fill="#5C4830">writing</text>
  <text x="500" y="560" text-anchor="middle" font-size="6" font-style="italic" fill="#5C4830">room</text>
  <!-- the dwelling's entry: a 4 ft earthen-floored vestibule inside the east door, beside the writing room -->
  <rect x="519" y="537" width="11" height="34" fill="url(#doma-earth)"/>
  <rect x="526" y="548" width="4" height="12" fill="#4A3318"/>
  <!-- the kitchen end: the hearth, and the doma's yard door on the WEST gable, facing the kitchen garden and the service way
       (never onto the sanctuary's ground behind the hall) -->
  <text x="374" y="532" text-anchor="middle" font-size="7.5" font-style="italic" fill="#5C4830">kitchen</text>
  <rect x="370" y="460" width="8" height="8" fill="#3A2010"/>
  <circle cx="374" cy="464" r="1.6" fill="#E08A30"/>
  <rect x="350" y="500" width="4" height="12" fill="#4A3318"/>

  <!-- THE SANCTUARY (honden): one bay, 6 ft square, on the axis behind the hall, on its plinth -->
  <rect x="427" y="398" width="26" height="4" fill="#B8AE98" stroke="#7A7060" stroke-width="0.6"/>
  <rect x="431" y="380" width="18" height="18" fill="#C9876C" stroke="#6B2A18" stroke-width="1.4" id="sanctuary"/>
  <text x="440" y="372" text-anchor="middle" font-size="8" font-style="italic" fill="#6B2A18">sanctuary of Bishamon</text>

  <!-- The privy at the west gable's FRONT corner - reached under cover from the doma, clear of the kitchen door, off the sanctuary's
       ground, near the service way for the night-soil collector - and the kitchen garden beside the west end -->
  <rect x="335" y="557" width="15" height="15" fill="#7E726A" stroke="#4A3318" stroke-width="0.8"/>
  <text x="342" y="553" text-anchor="middle" font-size="7" font-style="italic" fill="#4A4640">privy</text>
  <rect x="296" y="450" width="42" height="90" fill="url(#garden-stipple)" stroke="#7A8C5C" stroke-width="1" stroke-dasharray="3 2" id="kitchen_garden"/>
  <text x="317" y="490" text-anchor="middle" font-size="7" font-style="italic" fill="#3A4A28">kitchen</text>
  <text x="317" y="500" text-anchor="middle" font-size="7" font-style="italic" fill="#3A4A28">garden</text>

  <!-- Fire-water tubs at the hall's front corners and the kitchen end (gutter-fed, against the wall) -->
  <g fill="#8FB0C6" stroke="#3A5060" stroke-width="1">
    <circle cx="362" cy="422" r="3.8"/>
    <circle cx="386" cy="422" r="3.8"/>
    <circle cx="356" cy="579" r="3.8"/>
    <circle cx="524" cy="579" r="3.8"/>
  </g>
  <text x="586" y="586" text-anchor="end" font-size="7" font-style="italic" fill="#3A5060">fire-water tubs</text>
</svg>
