<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 460" font-family="Georgia, serif">
  <rect x="0" y="0" width="380" height="460" fill="#EFE3C2"/>
  <text x="200" y="20" text-anchor="middle" font-size="14" font-weight="bold">Synthetic country shrine</text>
  <g stroke="#3A2E1C"><line x1="20" y1="30" x2="110" y2="30" stroke-width="2"/></g>
  <text x="65" y="44" text-anchor="middle" font-size="10">30 ft</text><text x="65" y="54" text-anchor="middle" font-size="8">(3 px = 1 ft)</text>
  <rect x="40" y="70" width="320" height="360" fill="url(#keidai-gravel)" id="precinct"/>
  <g id="fence" stroke="#7A6A4A" stroke-width="2" fill="none"><line x1="40" y1="70" x2="360" y2="70"/><line x1="40" y1="70" x2="40" y2="430"/><line x1="360" y1="70" x2="360" y2="430"/><line x1="40" y1="430" x2="170" y2="430"/><line x1="230" y1="430" x2="360" y2="430"/></g>
  <rect x="185" y="250" width="30" height="180" fill="none" id="approach"/>
  <rect x="170" y="418" width="60" height="24" fill="none" id="arch"/>
  <text x="200" y="450" text-anchor="middle" font-size="9">arch</text>
  <rect x="140" y="130" width="120" height="120" fill="#DDB87A" stroke="#5A3F1E" stroke-width="1.5" id="hall"/>
  <text x="200" y="195" text-anchor="middle" font-size="11" font-weight="bold">hall and dwelling</text>
  <rect x="190" y="90" width="20" height="20" fill="#C9876C" stroke="#6B2A18" stroke-width="1.2" id="sanctuary"/>
  <text x="200" y="86" text-anchor="middle" font-size="8">sanctuary</text>
  <rect x="240" y="330" width="22" height="22" fill="#9C8C70" stroke="#5C4830" stroke-width="1.2" id="well"/>
  <text x="251" y="365" text-anchor="middle" font-size="8">well</text>
</svg>
