<li data-orig="nougyoudoboku-suikou#1">original: 「水口の設置数は各耕区ごとに1箇所が原則ですが、水口間隔が50ｍ以上の場合は水回りを早めるために設置数を2箇所以上にします。」</li>
<li data-orig="nougyoudoboku-suikou-2#1">original: 「水じり（落水口）は、各耕区から末端排水路（小排水路）へ排水するための排水口です。」</li>
<li data-orig="nougyoudoboku-suikou-2#2">original: 「水じりの設置数は各耕区ごとに1箇所が原則ですが、水深が浅くなった場合の田面排水を考慮して、水じり間隔が50ｍ以上で設置数を2箇所以上にします。」</li>
