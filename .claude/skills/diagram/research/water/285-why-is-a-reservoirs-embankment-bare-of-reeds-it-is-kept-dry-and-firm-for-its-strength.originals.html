<li data-orig="tameike-jawiki#1">original: 「堤は耕作を禁じたり、草刈りや野焼きを行ったりして草木の生育を阻む等、強度を維持するための管理が行われる。」</li>
<li data-orig="tameike-jawiki#2">original: 「そのため日当りが良くなり、日光を好む植物がよく生える。」</li>
<li data-orig="tameike-jawiki#3">original: 「ワレモコウ、キキョウ、リンドウ、オミナエシなどはこのような場所によく生育したもので、秋の七草も多くはこのような場所に見られる。」</li>
<li data-orig="kagawa-tameike-structure-2#1">original: 「波等による浸食防止を図るための設備で、捨石、石張り、コンクリートブロック張などの構造があります。」</li>
