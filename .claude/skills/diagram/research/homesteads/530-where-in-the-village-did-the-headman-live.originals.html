<li data-orig="kotobank-shoya#1">original: 「庄屋は本百姓の選挙または協議によって決められることもあったが、多くの場合は村の旧家が世襲した。」</li>
<li data-orig="kusawake-jawiki#1">original: 「近代以前においては草分けとされる家（史実か否かは別として）が、代々名主・庄屋などの村役人の地位を占め、そうでない場合でも村内に複数の分家を有する宗家として発言力を有した。」</li>
<li data-orig="kusawake-jawiki#2">original: 「祭祀の場や土地・用水などの共有財産の利用権に関しても優先的な地位を占めた」</li>
