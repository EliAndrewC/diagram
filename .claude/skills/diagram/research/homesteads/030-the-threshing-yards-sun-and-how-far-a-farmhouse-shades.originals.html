<li data-orig="kayabuki-jawiki#1">original: 「基本的に雨漏りを防止するために急勾配の屋根にするが」</li>
<li data-orig="kayabuki-jawiki#2">original: 「使用する植物の茎などが太いと隙間が大きくなり雨漏りがしやすいため、より急勾配が要求される。」</li>
<li data-orig="gassho-jawiki#1">original: 「合掌造りにすることで屋根裏に小屋束のない広い空間が生まれる」</li>
<li data-orig="gassho-jawiki#2">original: 「屋根裏に二層もしくは三層の空間を確保することにつながり、豪雪への対策以外に養蚕業にとっても都合が良いものであった」</li>
<li data-orig="inekari-jawiki-2#1">original: 「稲が熟する秋に、その穂ごと切り取るのが稲刈りである。」</li>
