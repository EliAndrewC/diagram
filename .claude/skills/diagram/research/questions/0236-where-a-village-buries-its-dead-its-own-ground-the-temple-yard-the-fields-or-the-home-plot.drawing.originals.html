<li data-orig="kawazoe-2010-ryobosei-9#1">original: 「カミには神社，詣り墓には寺院，居住域から外部へと続く道の途中や，道と水系の交差する地点には祠がおかれる．」</li>
<li data-orig="kawazoe-2010-ryobosei-9#2">original: 「その際に，埋め墓は集落よりも下にあることはあっても，上になることはない．」</li>
<li data-orig="kawazoe-2010-ryobosei-9#3">original: 「水系の上流・下流が地名としての『上』『下』に対応していることが多く，水系によって作り出されるカミシモの方向概念は存在している．」</li>
<li data-orig="bunkotsu-jawiki#1">original: 「故人1人の遺骨を、2ヶ所以上の墓所や納骨堂に分けて納骨・所持すること」</li>
