<li data-orig="qimin-yaoshu-yangji#1">original: 「雞棲宜㧻地為籠内著棧雖鳴聲不朗而安穏易肥又免狐狸之患若在之樹林一遇風寒大者損瘦小者或死」</li>
<li data-orig="zhwiki-liuchu#1">original: 「指馬、牛、羊、雞、狗、豬這六种禽畜」</li>
<li data-orig="weilongwu-zhwiki#1">original: 「围龙屋是一種客家人獨有的圍樓形態建築」</li>
<li data-orig="weilongwu-zhwiki#2">original: 「所谓“围屋”是指堂横屋后面半月形的围屋，一般作厨房、仓库、厕所、猪圈和鸡窝之用」</li>
