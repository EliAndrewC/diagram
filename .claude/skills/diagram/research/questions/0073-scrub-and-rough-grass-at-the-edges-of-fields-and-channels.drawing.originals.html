<li data-orig="kotobank-azebiki#1">original: 「検地の時、耕地の面積から畔幅一尺（約三〇センチメートル）と畔際左右一尺ずつを除いて検地すること。」</li>
<li data-orig="kotobank-azebiki#2">original: 「あせ際壱尺宛可除、但、類地もあせ際壱尺宛引之、あせ壱尺之積、類地共にあせ引壱尺五寸宛之積たるへし」</li>
<li data-orig="kotobank-karishiki-3#1">original: 「草を肥料とする施肥法は古代から苗草として広く普及し，近世農業でも農民の自給肥料として重要な地位を占めていた。そのため水田の周囲には広大な採草地を必要とし，共同利用地である山野の入会地からも採取した。」</li>
