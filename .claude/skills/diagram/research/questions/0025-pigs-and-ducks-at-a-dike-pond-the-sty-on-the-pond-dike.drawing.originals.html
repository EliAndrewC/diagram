<li data-orig="pwsannong-zhusanjiao-nongyeshi-2#1">original: 「明中叶以后由于商品经济的影响 ... 商品经济还促进了其他养殖业的发展。如沙田区的养鸭业、基塘区的养猪业」</li>
<li data-orig="nongzheng-quanshu-41#1">original: 「玄扈先生曰： ... 或圈於魚塘之岸，草糞則每早掃於塘中，以飼草魚；而羊之糞，又可飼鰱魚。一舉三得矣。」</li>
<li data-orig="guangdong-xinyu-20#1">original: 「廣州瀕海之田，多產蟛蜞，歲食穀芽為農害，惟鴨能食之。鴨在田間，春夏食蟛蜞，秋食遺稻，易以肥大，故鄉落間多畜鴨。畜鴨有埠，埠有主，以民有恆產者為之。凡鴨食人田稻，責之埠主，埠主責之畜鴨民，按名以償，無有敢為暴者。」</li>
