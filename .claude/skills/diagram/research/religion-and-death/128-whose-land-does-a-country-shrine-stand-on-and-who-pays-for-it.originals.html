<li data-orig="jochi-jawiki#1">original: 「江戸時代に幕府・大名より年貢を免除された土地のうち、朱印地・黒印地を除いたものを指す。」</li>
<li data-orig="jochi-jawiki#2">original: 「寺社の境内や、無年貢証文のある田畑・屋敷など特別な由緒のある土地で」</li>
<li data-orig="shuinchi-jawiki#1">original: 「最も広い高野山や日光東照宮でも1万石程度、最も狭いものではわずか1石で」</li>
<li data-orig="danka-seido-jawiki#1">original: 「檀家は特定の寺院に所属し、葬祭供養の一切をその寺に任せ、布施を払う。」</li>
<li data-orig="mianning-village-temples-3#1">original: 「或舍田舍地，或半买半舍，以为神圣永远香灯之资」</li>
<li data-orig="lijia-zhwiki#1">original: 「此里甲制度，最大功能在于分配繇役及按丁纳税等。」</li>
