<p><strong>Required, not optional</strong> (GM 2026-08-27, constitution v2.10.0): every research finding cites its sources here. <strong>What counts as a source</strong>, in order: primary and scholarly work; a serious reference - museum, ministry, university, standards body, an established encyclopedia such as Wikipedia (and its underlying references over the article itself). <strong>Never an AI-generated encyclopedia or summary</strong> (Grokipedia included): machine-rewritten from other sources, no editorial community, no provenance a reader can follow - citing it hands the interactive map's reader a dead end. A web-search result summary is a pointer to sources, never a source.</p>
