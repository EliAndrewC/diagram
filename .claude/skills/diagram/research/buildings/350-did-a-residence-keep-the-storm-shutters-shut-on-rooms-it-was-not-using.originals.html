<li data-orig="amado-kotobank#1">original: 「和風建築の開口部の外側に設ける板戸で，一本溝の敷居の上を走り，不用時には戸袋に納められるのが普通である。」</li>
<li data-orig="amado-kotobank#2">original: 「雨戸が創案されたのは桃山時代で，豊臣秀吉の聚楽第で用いられたのはその早い例である。」</li>
<li data-orig="amado-kotobank-2#1">original: 「風雨に対する保護、夜間の用心、保温を目的とする。16世紀には縁先の柱間に建てられた引き違いの板戸であったが、17世紀に入って戸袋(とぶくろ)をもち、一本溝の敷居、鴨居(かもい)に建てる形式がつくられた。」</li>
<li data-orig="amado-kotobank-3#1">original: 「昼間は戸袋に格納するようになっている」</li>
