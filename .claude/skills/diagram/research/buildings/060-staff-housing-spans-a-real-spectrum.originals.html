<li data-orig="takayama-jinya-jawiki-3#1">original: 「1830年（天保元年）の絵図を基に約20億円を掛けて蔵番長屋、郡代役宅、奥座敷などが、ほぼ江戸時代の状態にまで復元された。」</li>
<li data-orig="hatchobori-jawiki#1">original: 「しかし、1635年、八丁堀にあった多くの寺は、浅草への移転を命じられた。その後、寺のあった場所に、町奉行配下の与力、同心の組屋敷が設置されるようになったという。時代劇で同心が自分達を“八丁堀”と称したのはこれに因む。」</li>
<li data-orig="jinya-jawiki#1">original: 「居館・役所・家臣の役宅や土蔵、調練場などを配置する構成がみられる」</li>
<li data-orig="machi-bugyo-jawiki-3#1">original: 「町奉行の役宅は奉行所内にあった。」</li>
