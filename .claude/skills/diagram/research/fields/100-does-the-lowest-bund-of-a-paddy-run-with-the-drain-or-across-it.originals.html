<li data-orig="aze-jawiki-10#1">original: 「田んぼの脇に流れる開水路との間に設けられる畦は、溝畔と呼ばれ区別されることがある。水路は公共の土地であることが多く、地境は田んぼ側の法尻あるいは法尻あるいは水張ラインに設定されることがある。」</li>
<li data-orig="bungotakada-tagoshi-2#1">original: 「現代的な水田は、用水路から水を引き、排水路に水を出しています。」</li>
<li data-orig="bungotakada-tagoshi-2#2">original: 「しかし、田染荘小崎では水田から水田へ水を伝える「田越し」灌漑を残しています。」</li>
<li data-orig="suido-ishizue-kochi-seiri-3#1">original: 「区画は30間×10間(約54m×18m)の１反(10a)で、すべての区画が用排水路と道路に接していた。」</li>
