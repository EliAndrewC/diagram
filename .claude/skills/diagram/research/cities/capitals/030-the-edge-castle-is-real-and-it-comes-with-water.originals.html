<li data-orig="jokamachi-jawiki-2#1">original: 「川など地形を巧みに利用するとともに、堀を掘り、土塁や石垣を築き」</li>
<li data-orig="kitsuki-castle-jawiki#1">original: 「北は高山川、東は守江湾に囲まれた天然の要害である。」</li>
<li data-orig="kitsuki-castle-jawiki#2">original: 「八坂川の河口にある台山（だいやま）の上に築かれた。」</li>
<li data-orig="kitsuki-castle-jawiki#3">original: 「杵築城を中心に、南北の高台に武家屋敷群があり、その谷間に商人の町が挟まれています。」</li>
