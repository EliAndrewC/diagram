<li data-orig="tamagawa-josui-jawiki#1">original: 「羽村取水堰で多摩川から取水し、武蔵野台地を東流し、現在の四谷四丁目交差点付近にあった四谷大木戸に付設された「水番所」（水番屋）を経て、江戸市中へと分配されていた。羽村市から大木戸までの約43キロメートルは全て露天掘りで、水番所以下は木樋や石樋を用いた地下水道である。」</li>
<li data-orig="edokara-yosuibaki#1">original: 「江戸時代、玉川上水の水量調整のため、排水を流した、余水吐（よすいばき）という施設」</li>
<li data-orig="edokara-yosuibaki#2">original: 「四谷大木戸の南にある谷です。この谷にはかつて、新宿御苑の中にある湧水池を源流とする渋谷川が流れていました」</li>
