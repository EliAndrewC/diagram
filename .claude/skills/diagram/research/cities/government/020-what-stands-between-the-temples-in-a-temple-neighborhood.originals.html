<li data-orig="hokora-jawiki#1">original: 「神社の簡略形で、人が立ち入ることが難しい場所や、集落や個人が所有する土地に設置され」</li>
<li data-orig="akiba-jinja-jawiki#1">original: 「祠の場合は火伏せの神でもあるため、燃えにくい石造りの祠などが見かけられる。小さな祠であることが多く、一つの町内に何箇所も設置されている場合もある。」</li>
<li data-orig="inari-jinja-jawiki#1">original: 「神道系の稲荷神社の入り口には通常、朱色の鳥居が建てられている。朱塗りは社殿や鳥居で広く使われ、稲荷を象徴するものになっている」</li>
