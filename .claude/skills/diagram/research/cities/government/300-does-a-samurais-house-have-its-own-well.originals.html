<li data-orig="semboku-bukeyashiki-21#1">original: 「芦名氏の重臣」</li>
<li data-orig="semboku-bukeyashiki-21#2">original: 「屋根は木羽葺きで、しとみ戸やつるべ式の井戸があり」</li>
<li data-orig="semboku-bukeyashiki-21#3">original: 「角館の中級武士としての落ち着いた構えを残しています」</li>
<li data-orig="fujiclean-ido#1">original: 「文化11年（1814）に書かれた本によると、井戸掘りには200両もの費用がかかるため武家には手が出せず大商人しか掘れなかったのですが、大阪から「あをり」という奇器を使い無造作に井戸を掘る技術が伝えられ、3両ほどで井戸が掘れるようになって普及した」</li>
<li data-orig="fujiclean-ido-2#1">original: 「どの家にも井戸があったわけではありません。多くは共同の井戸でした」</li>
