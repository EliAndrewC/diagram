<li data-orig="bunka-sugimoto-omoya-3#1">original: 「主屋の後方に大蔵、隅蔵、中蔵が並び建ち、屋敷の周囲には高塀を廻らせる。」</li>
<li data-orig="matsusaka-hasegawa-kanko-3#1">original: 「土蔵の裏手には、町境でもある背割排水が流れ、その奥には池を中心とした回遊式庭園が広がっています。」</li>
<li data-orig="hinomi-yagura-jawiki#1">original: 「町ごとに番屋（番所、自身番とも）を設置し番人（火番、番太郎・番太と呼ばれていた）を常駐させて24時間態勢で警戒にあたるのが一般的であった」</li>
