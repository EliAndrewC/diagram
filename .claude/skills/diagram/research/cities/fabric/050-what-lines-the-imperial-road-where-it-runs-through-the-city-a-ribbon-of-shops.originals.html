<li data-orig="kotobank-chaya#1">original: 「江戸時代，旅行者を対象として道中筋に出現した茶店は，途中の休息所であったから，当初は宿場を離れた山中などに開店したが，しだいに宿はずれ（棒鼻（ぼうはな））にまで進出して，これを立場（たてば）茶屋と呼んだ。」</li>
<li data-orig="jokamachi-jawiki-2#1">original: 「城下に入ると幹線道路の両脇に家屋を隙間なく配置させることで城を見え難くして」</li>
<li data-orig="jokamachi-jawiki-2#2">original: 「旅籠、木賃宿、茶屋、商店などが建ち並び」</li>
