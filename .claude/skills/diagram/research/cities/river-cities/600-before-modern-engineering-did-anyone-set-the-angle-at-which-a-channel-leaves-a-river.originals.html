<li data-orig="hamura-tamagawa-josui#1">original: 「玉川上水は承応2年（1653）、江戸のまちや武蔵野台地の村々への飲料水や生活用水を供給するためにつくられた上水道です。」</li>
<li data-orig="hamura-tamagawa-josui-2#1">original: 「羽村は標高も高く、多摩川が南岸の草花丘陵の尾根にぶつかり対岸に向かって水が集まる地形になっていたため、取水口として選ばれたと考えられます。」</li>
<li data-orig="hamura-tamagawa-josui-3#1">original: 「羽村の堰（せき）では、自然の水の流れが蛇籠（じゃかご）や枠、投渡堰（なげわたしぜき）によって誘導され、取水口から取り込まれています。」</li>
