<li data-orig="shanghai-xiancheng-chengqiang-zhwiki-2#1">original: 「乾隆年间，护城河淤塞，知县李希舜下令疏浚，使之通舟楫」</li>
<li data-orig="shanghai-xiancheng-chengqiang-zhwiki-3#1">original: 「护城河与水门相通，以利航运，并通黄浦江潮汐，藉以为城内居民供应新鲜水源及排泄污水」</li>
<li data-orig="kotobank-hori#1">original: 「敵の侵入を防ぐために、城の周囲を掘って水をたたえた所。」</li>
<li data-orig="xian-wall-zhwiki#1">original: 「城墙的外侧有护城河，宽20米，深10米，终年积水」</li>
<li data-orig="xian-wall-zhwiki#2">original: 「河川より水を引き入れてる場合、船を利用することも多く、船を城塁につなぐ場合は凹形に堀を屈入させ船溜とし、これを水撚り（みずひねり）といった。」</li>
