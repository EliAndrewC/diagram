<li data-orig="tongdian-157-wikisource#1">original: 「其弩手去賊一百五十步即發箭，弓手去賊六十步即發箭。若賊至二十步內，即射手、弩手俱捨弓弩，令駐隊人收。其弓拏手先絡膊，將刀棒自隨，即與戰鋒隊齊入奮擊」</li>
<li data-orig="cass-ancient-chi#1">original: 「步（一寻，行走时两脚间距离，周时八尺，秦时六尺，旧制以营造尺五尺为一步）」</li>
<li data-orig="cass-ancient-chi-2#1">original: 「其长度与唐一尺（30.7厘米）的一半吻合」</li>
<li data-orig="shoucheng-lu-juan2-wikisource#1">original: 「馬面，舊制六十步立一座，跳出城外不減二丈，闊狹隨地利不定，兩邊直覷城腳。」</li>
