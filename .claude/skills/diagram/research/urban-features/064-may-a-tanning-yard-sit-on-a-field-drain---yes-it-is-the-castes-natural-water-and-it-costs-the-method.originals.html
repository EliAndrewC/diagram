<li data-orig="mizuarasoi-jawiki#1">original: 「水利権の管理は領主の裁定から水利慣行として守られる用水組合を基本とした村落間の自治へと比重を移していった」</li>
<li data-orig="mizuarasoi-jawiki#2">original: 「中世の日本においては旱魃などが起こると暴力行為を伴う紛争となったが、近世においては暴力より訴訟が望まれ、領主は示談を薦めた」</li>
<li data-orig="mizuarasoi-jawiki#3">original: 「明治29年の河川法成立以前より取水を行っていた農業用水などに認められている」</li>
<li data-orig="himeji-shironameshi-jawiki-5#1">original: 「塩漬けにした皮を数日間河川に浸し」</li>
