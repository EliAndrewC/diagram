<li data-orig="kotobank-tsurube-ido#1">original: 「村・村組などの共同利用の例も少なくなく」</li>
<li data-orig="kotobank-tsujiido#1">original: 「路傍にある共同の井戸を辻井戸，町かどにある共同便所を辻便所といった。」</li>
<li data-orig="seiyo-karihama-ido#1">original: 「かつて水源の乏しかった狩浜では、簡易水道が整備された昭和27年まで、主な用水源は堀井戸や湧水でした。堀井戸は5～10軒に1か所ほどの割合でつくられ、その数は約150か所(注1)にも及びますが」</li>
<li data-orig="seiyo-karihama-ido#2">original: 「本浦で11か所、枝浦で1か所が共同で使われていたことがわかりました。共同井戸の周りには地面に石を敷き込み、井戸端空間を作り出しているものが多くありました。」</li>
