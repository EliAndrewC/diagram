<li data-orig="nagaya-jawiki-2#1">original: 「路地に共同トイレがあり...水は共同の井戸が有った」</li>
<li data-orig="kanda-josui-jawiki#1">original: 「長屋にも上水井戸が設置され、住人たちが共同でして容姿いた。」</li>
<li data-orig="kanda-josui-jawiki#2">original: 「路地に共同トイレがあり、風呂は無い。水は共同の井戸が有ったが」</li>
<li data-orig="kanda-josui-jawiki-2#1">original: 「上水による給水順次は武家地が優先で、残りの水を町人地へ給水している。」</li>
<li data-orig="semboku-bukeyashiki#1">original: 「屋根は木羽葺きで、しとみ戸やつるべ式の井戸があり」</li>
<li data-orig="semboku-bukeyashiki#2">original: 「芦名氏の重臣」</li>
