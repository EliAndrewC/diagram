<li data-orig="coggins-minor-2018-6#1">original: 「不少村落在選址時，考慮到風水上的因素，通常會在茂密的樹林旁興建，令其成為村落後方的綠帶屏障。」</li>
<li data-orig="fengshuilin-zhwiki#1">original: 「他們更會在風水林栽種具有不同實用價值的樹木（如果樹、榕樹、樟樹及竹等），使風水林有其實質經濟價值。」</li>
<li data-orig="kotobank-yashikirin#1">original: 「屋敷の周囲に防風や防火のために植えた樹林」</li>
<li data-orig="kotobank-yashikirin#2">original: 「明治時代以前には家の全周を囲っていたが、水害の減少と建築様式の変化から北と西側だけをカバーする鉤型の形状へと変化した。」</li>
