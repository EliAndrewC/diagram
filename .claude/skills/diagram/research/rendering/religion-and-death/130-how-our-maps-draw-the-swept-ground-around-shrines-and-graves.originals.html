<li data-orig="ndl-crd-nanukabon-2#1">original: 「【資料1】『日本の祝日と歳事の由来』p90 七月七日をボンハジメ、ナヌカボンといい、墓や墓への道を清掃する。」</li>
<li data-orig="kotobank-ujiko-2#1">original: 「ところで、どのような氏神でも、氏子中(うじこじゅう)からとくに世話役として氏子総代が選出され、その管理、運営にあたる。」</li>
<li data-orig="kotobank-ujiko-2#2">original: 「一定の任期をもつ輪番制であったりするが、社の清掃、神主の世話、祭礼の運営の責任者となる。」</li>
<li data-orig="dijing-jingwulue-wikisource#1">original: 「三月清明日，男女掃墓，擔提尊榼，轎馬後掛楮錠，粲粲然滿道也。拜者、酹者、哭者、為墓除草添土者，焚楮錠次，以紙錢置墳頭。望中無紙錢，則孤墳矣。」</li>
