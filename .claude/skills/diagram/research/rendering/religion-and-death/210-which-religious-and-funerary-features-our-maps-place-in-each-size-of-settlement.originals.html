<li data-orig="dosojin-jawiki#1">original: 「村落の出入口、峠、辻、橋のたもとなど、空間的・社会的な境界に祀られ」</li>
<li data-orig="dosojin-jawiki#2">original: 「集落の境や村の中心、村内と村外の境界や道の辻、三叉路などに主に石碑や石像の形態で祀られる神で」</li>
<li data-orig="sanko-densetsu-jawiki#1">original: 「三倉鼻には鬢水（びんすい）入れという井戸の近くに龍神祠があって、天瀬川の人たちが11月20日を龍神の日と呼んで祭りをしている」</li>
