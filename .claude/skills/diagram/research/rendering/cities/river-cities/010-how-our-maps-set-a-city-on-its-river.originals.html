<li data-orig="panmen-zhwiki#1">original: 「水城门在陆门南侧，也有内外两重，纵深24米，前后分置水闸和木栅，两门之间有暗道通向城楼。」</li>
<li data-orig="chongqing-chengqiang-zhwiki#1">original: 「重庆作为山城，南宋城墙在规划布局上“踞山围城，依江为壕”」</li>
<li data-orig="chongqing-chengqiang-zhwiki#2">original: 「高十丈，周二千六百六十丈七尺，环江为池，门十七，九开八闭」</li>
<li data-orig="shiliupu-zhwiki#1">original: 「县城的宝带门（小东门）与黄浦江之间」</li>
<li data-orig="shiliupu-zhwiki#2">original: 「从这里向南直到陆家浜，停泊着数千条沙船」</li>
