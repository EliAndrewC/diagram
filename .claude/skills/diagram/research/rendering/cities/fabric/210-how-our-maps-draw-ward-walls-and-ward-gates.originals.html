<li data-orig="jishinban-jawiki#1">original: 「木戸番屋・自身番屋ともに、各町内の大通りの両端に設置された木戸に接して建てられており、一方に木戸番が、もう一方に自身番が詰めた」</li>
<li data-orig="jishinban-jawiki#2">original: 「運営の費用は各町が負担した」</li>
<li data-orig="kotobank-kidoban-4#1">original: 「この木戸は，大きな町では1町単位，中小の町では数町単位で設置され，江戸の場合，その形態は，2間ほどの間隔で建てた柱の間に，両開きの扉をつり，両脇には道路際までの柵，または板塀がとりつき，そばには木戸番の番小屋があった。」</li>
<li data-orig="jokamachi-jawiki-4#1">original: 「また、町割ごとに柵や木戸を設けて、夜には門を閉めて門番を立たせるなど、不審者の侵入を阻んでいた。」</li>
