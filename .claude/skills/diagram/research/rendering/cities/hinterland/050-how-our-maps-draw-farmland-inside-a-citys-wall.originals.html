<li data-orig="thepaper-city-fields-2#1">original: 「在北宋以前，我国古代的城市经济尚不太发展，这一点反映在蔬菜种植上，就是市民用菜多是利用城内各种空闲地段种菜自用。」</li>
<li data-orig="qimin-yaoshu-zhongkui-2#1">original: 「又冬種葵法：近州郡都邑有市之處，負郭良田三十畝」 and original: 「於中逐長穿井十口。〈井必相當，斜角則妨地。地形狹長者，井必作一行；地形正方者，作兩三行亦不嫌也。〉井別作桔橰、轆轤。」</li>
<li data-orig="jawiki-yosuiro#1">original: 「引水時は、用水路に堰板を入れるなどして水位を上げ、樋を開けて自然流入により田へ水を流し込む。」</li>
