<li data-orig="kotobank-benjo#1">original: 「近世の町屋では、通り庭が裏庭にまで及んだところに、小便所一つと大便所1ないし2が並んで設けられた。」</li>
<li data-orig="kotobank-benjo-2#1">original: 「町屋の裏長屋では、一軒一軒に便所を設けることはなく、裏長屋の建つ1区画の内の1か所か2か所に、一つの小便所といくつかの大便所を並べている。」</li>
<li data-orig="townhouse-jawiki-2#1">original: 「共用の井戸、便所は路地の奥に位置する」</li>
<li data-orig="kotobank-benjo-3#1">original: 「構造的にはくみ取り便所で、近郊の農家が肥料としてくみ取っていた。」</li>
