<li data-orig="zhang-guo-2019-nongshu-2#1">original: 「但近来肥壅、人工俱贵，载取费力，偷窝弊多，不能全靠租窖，则养猪羊尤为简便」</li>
<li data-orig="zhang-guo-2019-nongshu-2#2">original: 「猪专吃糟麦，则烧酒又获嬴息，有盈无亏白落肥壅，又省载取人工，何不为也？」</li>
<li data-orig="weilongwu-zhwiki#1">original: 「厨房、仓库、厕所、猪圈和鸡窝」</li>
<li data-orig="weilongwu-zhwiki#2">original: 「把水井、晒谷场、菜地和牲畜房、果树和鱼塘等等统统纳入围屋建造范围，从而做到足不出户即可自给自足。」</li>
