<li data-orig="fuchu-joge-pamphlet-5#1">original: 「代官所から離れた支配地に設けられた役所で、支所みたいなものでござる。」</li>
<li data-orig="fuchu-joge-pamphlet-5#2">original: 「幕末（慶応３年（1867））には役人が3 人来ていたでござる。」</li>
<li data-orig="fuchu-joge-pamphlet-6#1">original: 「陣屋の中に稲荷社や天神社があったのじゃ。」</li>
<li data-orig="fuchu-joge-pamphlet-6#2">original: 「明治 2 年の上下陣屋絵図（『上下町史』 通史編 2003 から引用）」</li>
<li data-orig="kotobank-yashikigami#1">original: 「屋敷すなわち宅地内の一隅やこれに接続した小区画に，小祠を構えあるいは古木や石などを依代（よりしろ）にするなどしてまつられている神をいう。」</li>
