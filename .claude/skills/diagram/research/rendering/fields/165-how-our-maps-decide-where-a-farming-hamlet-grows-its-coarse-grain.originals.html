<li data-orig="kokumori-jawiki-2#1">original: 「太閤検地においては、上田を1石5斗、中田を1石3斗、下田を1石1斗としてランクが1つ落ちるごとに2斗ずつ下げる方法（2斗下り）が採用され」</li>
<li data-orig="kokumori-jawiki-3#1">original: 「江戸時代には、下々田は9斗、畠は上畠を1石2斗として2斗下りする方法が採用されている。」</li>
<li data-orig="nimosaku-jawiki-3#1">original: 「さらに湿気に弱い麦は湿田では栽培できない。」</li>
<li data-orig="shimabatake-jawiki-4#1">original: 「作付けされたものとしては綿花やクワ、イチジクなどがあるが時代によって変化が激しい。」</li>
