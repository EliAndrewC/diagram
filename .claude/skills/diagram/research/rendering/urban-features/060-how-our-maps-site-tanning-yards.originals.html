<li data-orig="himeji-shironameshi-jawiki-4#1">original: 「塩漬けにした皮を数日間河川に浸し、微生物の作用によって毛根をゆるめる。」</li>
<li data-orig="himeji-shironameshi-jawiki-4#2">original: 「刃物により毛をこそぎおとす（脱毛する）。」</li>
<li data-orig="himeji-shironameshi-jawiki-4#3">original: 「塩となたね油を加えて空打ちし、さらに日光に晒しながらもみほぐす（なめす）。」</li>
<li data-orig="kawaramono-jawiki#1">original: 「彼らの生業は屠畜や皮革加工で、河原やその周辺に居住していたため河原者と呼ばれた。」</li>
<li data-orig="kawaramono-jawiki#2">original: 「河原に居住した理由は、河原が無税だったからという説と、皮革加工には大量の水が必要だからだという説がある。」</li>
