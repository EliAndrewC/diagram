<li data-orig="songshi-178-wikisource-3#1">original: 「諸城、砦、鎮、市戶及千以上有知監者，依各縣增置居養院、安濟坊、漏澤園。」</li>
<li data-orig="mengliang-lu-13-wikisource-5#1">original: 「自淳祐年有名相傳者，如貓兒橋魏大刀熟肉，潘節幹熟藥鋪，壩頭榜亭安撫司惠民坊熟藥局，市西坊南和劑惠民藥局，」</li>
<li data-orig="koishikawa-yojosho-jawiki#1">original: 「養生所は享保7年（1722年）12月13日に小石川薬園（現在の小石川植物園）内に開設された」</li>
