<li data-orig="kotobank-daihachiguruma#1">original: 「1815年（文化12）の芝車町名主の書上によれば，明暦の大火（1657）後江戸市中に普請多く，そのため木挽町辺に居住の牛車大工が初めて製造して以来流行し，現在では京，大坂その他諸国城下町でも使用されるようになったという。」</li>
<li data-orig="kotobank-daihachiguruma-2#1">original: 「大坂では大八車は使用されず、円板車輪に板張り車台のべか車が利用された。」</li>
<li data-orig="kotobank-daihachiguruma-3#1">original: 「江戸後期には城下町以外にも普及した。」</li>
<li data-orig="kotobank-daihachiguruma-4#1">original: 「大八車は車台の長さ8尺，幅2尺5寸で，」</li>
<li data-orig="mlit-kinsei-michi#1">original: 「物資の運搬は大八車、馬、牛車。」</li>
