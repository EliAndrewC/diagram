<li data-orig="kotobank-ressen#1">original: 「道路に沿い第一次産業を主とする家が並ぶ路村に対し、街道に面し交通的・商業的機能をもつ細長い集落を街村という。」</li>
<li data-orig="kotobank-edo#1">original: 「この大火以後，江戸城近くの大名屋敷や寺社の郊外への移転が行われ，町地でも火除地がつくられ，街道ぞいに町地が拡大していった。」</li>
<li data-orig="kotobank-edo#2">original: 「明暦の大火以後はこれらの郊外の街道ぞいに町地が数多く形成されていった。」</li>
<li data-orig="kotobank-edo-2#1">original: 「1662年（寛文2）には周辺の宅地化した区域を町並地として町奉行(まちぶぎょう)支配とした。」</li>
