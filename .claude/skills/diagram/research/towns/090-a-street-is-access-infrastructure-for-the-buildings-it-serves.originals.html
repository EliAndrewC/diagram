<li data-orig="machiya-shoka-jawiki#1">original: 「間口を広く構えるには多大な財力を要した。その結果、町屋は敷地の間口いっぱいに建てられ、奥に長い間取りを持つことになった。」</li>
<li data-orig="machiya-shoka-jawiki#2">original: 「裏長屋は表店の主人が大家となり、店子に貸し出される借家である。」</li>
<li data-orig="kotobank-uradana#1">original: 「市街地の裏通りや、商家の背後の地所に建てられた家。とくに、裏通りに面して建てられた粗末な棟割長屋をいった。」</li>
<li data-orig="kotobank-uradana#2">original: 「江戸時代に江戸・大坂などの大都市の町人居住地で，表通りに面していない路地裏に建てられた小商人・職人・日雇いなど下層庶民の借家住居のこと。」</li>
