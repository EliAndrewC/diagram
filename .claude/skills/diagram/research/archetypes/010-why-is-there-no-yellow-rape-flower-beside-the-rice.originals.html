<li data-orig="rice-rape-calendar-summary#1">original: 「赣南地区(即赣州)油菜收获时间为4月上旬, 九江为5月上旬, 其他地区为4月中下旬; 赣南大部分地区水稻移栽时间为4月中旬, 赣北赣中大部为4月下旬—5月上旬。」</li>
<li data-orig="aburana-zhwiki#1">original: 「在臺灣，每年入冬前第二期水稻收割之後，有些稻農會在稻田灑油菜的種子，使稻田長滿油菜、進而開花，次年水稻插秧前再打入土壤裡做為綠肥。」</li>
<li data-orig="aburana-jawiki#1">original: 「菜の花（ナバナ）は、秋に種をまき、本葉が5 - 6枚の苗を株間30 - 40センチメートル (cm) で定植し、冬を越して3月上旬から4月上旬に花茎を切って収穫する」</li>
