<li data-orig="kato-1999-ittanbu-kukaku#1">original: 「錦見長太夫が岐阜県本巣郡穂積村稲里の約43町歩について，明治2(1869)年秋から翌年の水稲植付け前にかけて行った区画整理である。…農道と水路は1間幅，畦畔は2尺幅となっている。」</li>
<li data-orig="shokukaku-suiden-jawiki#1">original: 「小畦畔は幅50センチメートル以下で、芯材を持たず、耕期毎に作り替えられていたと考えられている。」</li>
<li data-orig="shokukaku-suiden-jawiki#2">original: 「小区画水田（しょうくかくすいでん）とは、弥生時代から古墳時代にかけての日本列島で造られた、非常に小さな区画からなる水田。」</li>
<li data-orig="shokukaku-suiden-jawiki#3">original: 「幅1メートル以上の」</li>
