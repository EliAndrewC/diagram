<li data-orig="dili360-2005-sangji#1">original: 「倒退20年，如果你来到美丽富饶的珠江三角洲，一望平野，处处是浓绿的蕉林蔗海和闪光的河堰鱼塘。」</li>
<li data-orig="dili360-2005-sangji#2">original: 「塘里养鱼，基上种桑树、种果树」</li>
<li data-orig="gd-gazetteer-sangji-2#1">original: 「随着经济社会的发展，城市化、工业化的冲击，水产养殖面积增加，塘基种植桑树面积减少，取而代之的是香蕉、甘蔗、柑橘为主的果蔬，桑基鱼塘慢慢演变成果基鱼塘、蔗基鱼塘和菜基鱼塘」</li>
