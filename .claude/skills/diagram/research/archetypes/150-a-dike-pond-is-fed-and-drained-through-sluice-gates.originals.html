<li data-orig="cssn-sangyuanwei#1">original: 「谚语“民乐有个窦，家家纺织声”“一船蚕丝出，一船白银归”正是当时佛山南海西樵民乐丝织业发达的历史见证。」</li>
<li data-orig="cssn-jiangnan-weitian-4#1">original: 「中有河渠，外有门闸。旱则开闸引江水之利，涝则闭闸拒江水之害。」</li>
<li data-orig="minle-dou-people#1">original: 「坐落于西樵镇的古闸――民乐窦。」</li>
<li data-orig="minle-dou-people#2">original: 「仰拍桥洞上方光绪四年间刻的“民乐窦”3个大字。这座古老的窦闸位于广东省佛山市南海区西樵镇民乐社区，是桑园围里众多窦闸之一。」</li>
<li data-orig="minle-dou-people-2#1">original: 「村民通过堤围、河涌、窦闸灌排，开发洼地、河滩，改造水塘养鱼，塘边植桑养蚕。」</li>
