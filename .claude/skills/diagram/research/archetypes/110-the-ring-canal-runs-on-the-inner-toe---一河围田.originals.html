<li data-orig="weinei-he-summary#1">original: 「所谓圩田，是指在临近江河湖海的地势低洼地区，人工筑堤挡水形成的农田」</li>
<li data-orig="weinei-he-summary#2">original: 「其共同的特征是不变的：低洼处筑堤，内以围田，外以围水。...从鸟瞰角度来看，各种圩田像是一个个大大小小的棋盘」</li>
<li data-orig="cssn-jiangnan-weitian-2#1">original: 「北宋范仲淹在《答手诏条陈十事》中描述道：“江南旧有圩田，每一圩方数十里，如大城，中有河渠，外有门闸。旱则开闸引江水之利，涝则闭闸拒江水之害。旱涝不及，为农美利。”」</li>
