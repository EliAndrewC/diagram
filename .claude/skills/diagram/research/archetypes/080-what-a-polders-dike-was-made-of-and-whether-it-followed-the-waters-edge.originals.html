<li data-orig="sdlib-shunde-jitang-4#1">original: 「取泥覆四周为基，中凹下为塘」</li>
<li data-orig="sdlib-shunde-jitang-5#1">original: 「基种桑，塘蓄鱼」</li>
<li data-orig="sdlib-shunde-jitang-5#2">original: 「将挖出泥土筑成塘基，上植果蔗」</li>
<li data-orig="wuhurec-wanchun#1">original: 「夹堤之脊，列植以桑，为桑若干万。」</li>
<li data-orig="wuhurec-wanchun#2">original: 「傅堤为柳百行，其下寒苇以列艺之，则水之所齿者，在百步之外，而堤未尝与水遇」</li>
