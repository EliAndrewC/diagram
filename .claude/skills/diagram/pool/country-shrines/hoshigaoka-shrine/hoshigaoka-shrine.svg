<svg xmlns="http://www.w3.org/2000/svg" viewBox="232 106 388 786" font-family="Georgia, 'Times New Roman', serif">
  <!-- ============================================================ -->
  <!-- Hoshigaoka Country Shrine - top-down diagrammatic plan          -->
  <!-- North at top; the village lies north, the approach rises from the south. -->
  <!-- 3 px = 1 ft. The country shrine's program: buildings/programs.md -->
  <!-- THE SHEET MATCHES THE VILLAGE MAP (feature 257): the hall's     -->
  <!-- center is map (392, 1074) of hoshigaoka.json; 6 sheet px = 1   -->
  <!-- map px. The map shows here the hall in its grove (feature 268, -->
  <!-- the GM 2026-09-27: "Add grove to map"), the seven arches 12 ft -->
  <!-- apart from 12 ft in front of it, the sacred tree and the basin -->
  <!-- beside the approach, and the shrine's well at the grove's back. -->
  <!-- No fence and no wall: a village shrine's ground is marked by   -->
  <!-- its arch and its wood (research/religion-and-death.html 122).  -->
  <!-- ============================================================ -->
  <defs>
    <!-- Swept gravel of the clearing at the hall (keidai): pale, with faint rake lines -->
    <pattern id="keidai-gravel" patternUnits="userSpaceOnUse" width="16" height="16">
      <rect width="16" height="16" fill="#E6DCC4"/>
      <line x1="0" y1="4" x2="16" y2="4" stroke="#D2C4A4" stroke-width="0.5"/>
      <line x1="0" y1="12" x2="16" y2="12" stroke="#D2C4A4" stroke-width="0.5"/>
      <circle cx="9" cy="8" r="0.5" fill="#C9B884"/>
    </pattern>
    <!-- The grove's floor: leaf litter under the canopy -->
    <pattern id="grove-floor" patternUnits="userSpaceOnUse" width="14" height="14">
      <rect width="14" height="14" fill="#C9C79C"/>
      <circle cx="3" cy="4" r="0.8" fill="#9A9868"/>
      <circle cx="10" cy="11" r="0.8" fill="#9A9868"/>
    </pattern>
    <!-- Kitchen garden stipple -->
    <pattern id="garden-stipple" patternUnits="userSpaceOnUse" width="14" height="14">
      <rect width="14" height="14" fill="#BFCFA0"/>
      <circle cx="3" cy="3" r="0.8" fill="#7A8C5C"/>
      <circle cx="10" cy="9" r="0.8" fill="#7A8C5C"/>
    </pattern>
    <!-- The kitchen's earthen floor -->
    <pattern id="doma-earth" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#CDB07A"/>
      <circle cx="3" cy="5" r="0.5" fill="#A88E58"/><circle cx="9" cy="10" r="0.5" fill="#A88E58"/>
    </pattern>
  </defs>

  <!-- The parchment: the grazing commons of the back-slope, beyond the grove's edge -->
  <rect x="0" y="0" width="900" height="1400" fill="#EFE3C2"/>

  <!-- Title block -->
  <g data-kind="-">
    <text x="252" y="136" text-anchor="start" font-size="20" font-weight="bold" fill="#3A2E1C">Hoshigaoka Country Shrine</text>
    <text x="252" y="156" text-anchor="start" font-size="11" font-style="italic" fill="#6B4F2A">the shrine of Hoshigaoka village district</text>
  </g>

  <!-- THE PRECINCT IS THE GROVE (research 124): 117 by 223 ft, from the shrine well at its back edge to the outermost
       arch, where the approach enters the shrine's ground (research 090). No fence, no wall (research 122). -->
  <rect x="250" y="170" width="350" height="670" fill="url(#grove-floor)" id="precinct"/>
  <!-- The swept clearing at the hall: the sanctuary, the hall and dwelling, the kitchen garden and privy at the west
       gable, and the forecourt at the hall's step where the basin stands -->
  <rect x="288" y="356" width="272" height="244" fill="url(#keidai-gravel)"/>
  <!-- The household's footpath to the well through the grove, from the clearing's north-west corner (the kitchen side),
       never across the sanctuary's ground -->
  <path d="M300,360 L426,184" fill="none" stroke="#E6DCC4" stroke-width="12" stroke-linecap="round"/>

  <!-- THE GROVE (chinju no mori): the shrine's own wood, the whole precinct but the clearing, the approach and the path -->
  <g id="grove" data-kind="shrine grove" fill="#7A8C5C" stroke="#56683E" stroke-width="1">
    <circle cx="328.8" cy="791.9" r="24.9"/>
    <circle cx="539.8" cy="792.9" r="25.2"/>
    <circle cx="446.9" cy="292.1" r="27.4"/>
    <circle cx="369.1" cy="326.4" r="25.4"/>
    <circle cx="372.8" cy="752.9" r="26.7"/>
    <circle cx="309.2" cy="657.7" r="25.4"/>
    <circle cx="502.7" cy="200.6" r="26.0"/>
    <circle cx="556.8" cy="312.2" r="28.6"/>
    <circle cx="550.8" cy="218.2" r="25.0"/>
    <circle cx="365.6" cy="200.6" r="25.1"/>
    <circle cx="310.4" cy="714.6" r="29.8"/>
    <circle cx="386.9" cy="692.1" r="25.6"/>
    <circle cx="276.1" cy="813.6" r="25.7"/>
    <circle cx="292.7" cy="288.0" r="27.0"/>
    <circle cx="479.9" cy="248.4" r="25.7"/>
    <circle cx="570.9" cy="629.8" r="25.7"/>
    <circle cx="284.6" cy="220.4" r="29.9"/>
    <circle cx="562.3" cy="733.5" r="27.5"/>
    <circle cx="378.0" cy="812.9" r="26.9"/>
    <circle cx="491.3" cy="753.5" r="24.1"/>
    <circle cx="337.7" cy="243.7" r="26.0"/>
    <circle cx="365.5" cy="644.9" r="25.2"/>
    <circle cx="429.9" cy="242.1" r="24.7"/>
    <circle cx="503.0" cy="304.1" r="25.5"/>
    <circle cx="493.2" cy="627.4" r="24.5"/>
    <circle cx="276.3" cy="758.3" r="24.7"/>
    <circle cx="533.0" cy="264.5" r="24.0"/>
    <circle cx="580.2" cy="265.3" r="18.5"/>
    <circle cx="271.6" cy="684.9" r="19.0"/>
    <circle cx="488.6" cy="807.3" r="20.0"/>
    <circle cx="396.0" cy="285.1" r="21.3"/>
    <circle cx="272.7" cy="617.8" r="20.2"/>
    <circle cx="271.9" cy="334.3" r="19.7"/>
    <circle cx="581.1" cy="818.8" r="18.6"/>
    <circle cx="581.1" cy="580.9" r="18.8"/>
    <circle cx="581.5" cy="778.0" r="18.2"/>
    <circle cx="581.8" cy="427.9" r="18.1"/>
    <circle cx="581.6" cy="517.6" r="18.3"/>
    <circle cx="461.5" cy="204.9" r="14.6"/>
    <circle cx="584.1" cy="376.4" r="15.2"/>
    <circle cx="324.7" cy="189.9" r="16.0"/>
    <circle cx="272.3" cy="426.9" r="13.7"/>
    <circle cx="582.1" cy="470.6" r="15.3"/>
    <circle cx="270.1" cy="471.4" r="14.7"/>
    <circle cx="271.4" cy="555.6" r="14.1"/>
    <circle cx="269.6" cy="400.2" r="13.1"/>
    <circle cx="582.2" cy="195.6" r="14.0"/>
    <circle cx="531.4" cy="635.4" r="14.0"/>
    <circle cx="266.4" cy="511.1" r="14.3"/>
    <circle cx="346.7" cy="688.0" r="13.6"/>
    <circle cx="583.3" cy="347.6" r="13.0"/>
    <circle cx="269.9" cy="583.1" r="13.5"/>
    <circle cx="271.0" cy="651.5" r="13.7"/>
    <circle cx="264.4" cy="720.5" r="14.2"/>
    <circle cx="266.1" cy="370.4" r="14.6"/>
    <circle cx="586.0" cy="232.7" r="13.5"/>
    <circle cx="582.4" cy="549.2" r="13.3"/>
  </g>

  <!-- The sacred tree beside the approach, ringed by its rope (shimenawa) - research 126 -->
  <g data-kind="sacred tree" fill="#7A8C5C" stroke="#3E5230" stroke-width="1.4">
    <circle cx="505.0" cy="686.0" r="33.0"/>
  </g>
  <!-- The approach (sando): a 10 ft gravel way from the grove's edge to the hall's front step, 88 ft, through the seven arches -->
  <g data-kind="approach">
    <rect x="425" y="578" width="30" height="262" fill="#D9CFB4" stroke="#C4B48E" stroke-width="0.8" id="approach"/>
  </g>

  <!-- THE SEVEN ARCHES (the GM's seven, 2026-09-26) at the 12 ft pitch (the GM 2026-09-27: "All maps, ~10-13 ft"), the
       innermost one pitch off the hall's face (the GM 2026-07-27), drawn IN PLAN: the top beam 15 by 1.5 ft across the
       approach, the two posts marked just proud of it (real posts hide under the beam - a drawing convention), 10.7 ft
       clear between them. The outermost is declared first: it stands at the grove's edge, where the way enters. -->
  <g data-kind="torii">
    <rect x="417.5" y="821" width="45" height="6" fill="none" id="arch"/>
    <line x1="417.5" y1="824" x2="462.5" y2="824" stroke="#A03020" stroke-width="4.5"/>
    <rect x="418" y="821" width="6" height="6" fill="#7A2418"/>
    <rect x="456" y="821" width="6" height="6" fill="#7A2418"/>
  </g>
  <g data-kind="torii">
    <rect x="417.5" y="785" width="45" height="6" fill="none" id="arch"/>
    <line x1="417.5" y1="788" x2="462.5" y2="788" stroke="#A03020" stroke-width="4.5"/>
    <rect x="418" y="785" width="6" height="6" fill="#7A2418"/>
    <rect x="456" y="785" width="6" height="6" fill="#7A2418"/>
  </g>
  <g data-kind="torii">
    <rect x="417.5" y="749" width="45" height="6" fill="none" id="arch"/>
    <line x1="417.5" y1="752" x2="462.5" y2="752" stroke="#A03020" stroke-width="4.5"/>
    <rect x="418" y="749" width="6" height="6" fill="#7A2418"/>
    <rect x="456" y="749" width="6" height="6" fill="#7A2418"/>
  </g>
  <g data-kind="torii">
    <rect x="417.5" y="713" width="45" height="6" fill="none" id="arch"/>
    <line x1="417.5" y1="716" x2="462.5" y2="716" stroke="#A03020" stroke-width="4.5"/>
    <rect x="418" y="713" width="6" height="6" fill="#7A2418"/>
    <rect x="456" y="713" width="6" height="6" fill="#7A2418"/>
  </g>
  <g data-kind="torii">
    <rect x="417.5" y="677" width="45" height="6" fill="none" id="arch"/>
    <line x1="417.5" y1="680" x2="462.5" y2="680" stroke="#A03020" stroke-width="4.5"/>
    <rect x="418" y="677" width="6" height="6" fill="#7A2418"/>
    <rect x="456" y="677" width="6" height="6" fill="#7A2418"/>
  </g>
  <g data-kind="torii">
    <rect x="417.5" y="641" width="45" height="6" fill="none" id="arch"/>
    <line x1="417.5" y1="644" x2="462.5" y2="644" stroke="#A03020" stroke-width="4.5"/>
    <rect x="418" y="641" width="6" height="6" fill="#7A2418"/>
    <rect x="456" y="641" width="6" height="6" fill="#7A2418"/>
  </g>
  <g data-kind="torii">
    <rect x="417.5" y="605" width="45" height="6" fill="none" id="arch"/>
    <line x1="417.5" y1="608" x2="462.5" y2="608" stroke="#A03020" stroke-width="4.5"/>
    <rect x="418" y="605" width="6" height="6" fill="#7A2418"/>
    <rect x="456" y="605" width="6" height="6" fill="#7A2418"/>
  </g>

  <!-- The shrine's well - its one well - where the village map sites it, 108 ft behind the hall, at the grove's back edge -->
  <g data-kind="well">
    <rect x="433" y="169" width="15" height="15" fill="#9C8C70" stroke="#5C4830" stroke-width="1.2" id="well"/>
    <circle cx="440.5" cy="176.5" r="4" fill="#3A3A34"/>
  </g>

  <!-- The stone basin beside the approach at the innermost arch, in the forecourt (research 126: a plain basin, not a
       roofed pavilion, at village scale - its form a guess) -->
  <g data-kind="basin">
    <rect x="393.5" y="585.5" width="9" height="9" fill="#9C8C70" stroke="#5C4830" stroke-width="1" id="basin"/>
    <circle cx="398" cy="590" r="2.4" fill="#5E7F8E"/>
    <text x="393.2" y="610.6" text-anchor="middle" font-size="7" font-style="italic" fill="#4A4640">basin</text>
    <line x1="402.5" y1="604.0" x2="402.5" y2="595.5" stroke="#4A4640" stroke-width="0.60" stroke-linecap="round" data-leader="1"/>
  </g>

  <!-- THE HALL AND DWELLING under one roof, at the footprint the village map draws (60 x 48 ft), hall and dwelling END TO END
       along the ridge as at Kaie-ji: the kitchen's earthen floor at the west end, the villagers' hall in the center facing the
       approach, the monk's rooms and the writing room at the east end; the hall's rear faces the sanctuary with nothing between -->
  <g data-kind="hall and dwelling">
    <rect x="350" y="428" width="180" height="144" fill="#DDB87A" stroke="#5A3F1E" stroke-width="2" id="hall"/>
    <g stroke="#6B4F2A" stroke-width="1" stroke-dasharray="4 3" fill="none">
      <line x1="398" y1="428" x2="398" y2="572"/>
      <line x1="482" y1="428" x2="482" y2="572"/>
      <line x1="482" y1="536" x2="530" y2="536"/>
      <line x1="518" y1="536" x2="518" y2="572"/>
      <line x1="398" y1="470" x2="482" y2="470"/>
    </g>
    <!-- the villagers' hall: its raised step on the approach, the altar band at its rear toward the sanctuary -->
    <rect x="398" y="572" width="84" height="6" fill="#E8D2A8" stroke="#6B4F2A" stroke-width="0.8"/>
    <rect x="416" y="432" width="48" height="5" fill="#6B2A18"/>
    <rect x="434" y="440" width="12" height="6" fill="#A03020" stroke="#6B2A18" stroke-width="0.6"/>
    <text x="440.0" y="499.7" text-anchor="middle" font-size="11" font-weight="bold" fill="#3A2E1C">hall and</text>
    <text x="440.0" y="512.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#3A2E1C">dwelling</text>
  </g>
  <!-- the kitchen end: the doma (earthen floor), the hearth, and the yard door on the WEST gable, facing the garden -->
  <g data-kind="kitchen" data-part-of="hall and dwelling">
    <rect x="351" y="429" width="47" height="142" fill="url(#doma-earth)"/>
    <rect x="370" y="460" width="8" height="8" fill="#3A2010"/>
    <circle cx="374" cy="464" r="1.6" fill="#E08A30"/>
    <rect x="350" y="500" width="4" height="12" fill="#4A3318"/>
    <text x="374.0" y="502.1" text-anchor="middle" font-size="7.5" font-style="italic" fill="#5C4830">kitchen</text>
  </g>
  <g data-kind="the monk's rooms" data-part-of="hall and dwelling">
    <rect x="483" y="429" width="46" height="106" fill="none"/>
    <text x="506.0" y="479.8" text-anchor="middle" font-size="7.5" font-style="italic" fill="#5C4830">the monk's</text>
    <text x="506.0" y="488.4" text-anchor="middle" font-size="7.5" font-style="italic" fill="#5C4830">rooms</text>
  </g>
  <g data-kind="writing room" data-part-of="hall and dwelling">
    <rect x="483" y="537" width="35" height="34" fill="none"/>
    <text x="500.5" y="552.2" text-anchor="middle" font-size="6" font-style="italic" fill="#5C4830">writing</text>
    <text x="500.5" y="559.1" text-anchor="middle" font-size="6" font-style="italic" fill="#5C4830">room</text>
  </g>
  <!-- the dwelling's entry: a 4 ft earthen-floored vestibule inside the east door, beside the writing room -->
  <g data-kind="genkan" data-part-of="hall and dwelling">
    <rect x="519" y="537" width="11" height="34" fill="url(#doma-earth)"/>
    <rect x="526" y="548" width="4" height="12" fill="#4A3318"/>
  </g>

  <!-- THE SANCTUARY (honden): one bay, 6 ft square, on the axis behind the hall, on its plinth -->
  <g data-kind="sanctuary">
    <rect x="427" y="398" width="26" height="4" fill="#B8AE98" stroke="#7A7060" stroke-width="0.6"/>
    <rect x="431" y="380" width="18" height="18" fill="#C9876C" stroke="#6B2A18" stroke-width="1.4" id="sanctuary"/>
    <text x="463.1" y="350.0" text-anchor="middle" font-size="8" font-style="italic" fill="#6B2A18">sanctuary of Bishamon</text>
    <line x1="427.0" y1="353.0" x2="427.0" y2="379.0" stroke="#6B2A18" stroke-width="0.64" stroke-linecap="round" data-leader="1"/>
  </g>

  <!-- The privy at the west gable's FRONT corner, and the kitchen garden beside the west end -->
  <g data-kind="latrine">
    <rect x="335" y="557" width="15" height="15" fill="#7E726A" stroke="#4A3318" stroke-width="0.8"/>
    <text x="337.7" y="609.1" text-anchor="middle" font-size="7" font-style="italic" fill="#4A4640">privy</text>
    <line x1="347.3" y1="602.5" x2="347.3" y2="573.0" stroke="#4A4640" stroke-width="0.60" stroke-linecap="round" data-leader="1"/>
  </g>
  <g data-kind="vegetable garden">
    <rect x="296" y="450" width="42" height="90" fill="url(#garden-stipple)" stroke="#7A8C5C" stroke-width="1" stroke-dasharray="3 2" id="kitchen_garden"/>
    <text x="317.0" y="492.9" text-anchor="middle" font-size="7" font-style="italic" fill="#3A4A28">kitchen</text>
    <text x="317.0" y="500.9" text-anchor="middle" font-size="7" font-style="italic" fill="#3A4A28">garden</text>
  </g>

  <!-- Fire-water tubs at the hall's back corners and its front (gutter-fed, against the wall) -->
  <g data-kind="fire-water tubs" id="fire_water">
    <g fill="#8FB0C6" stroke="#3A5060" stroke-width="1">
      <circle cx="362" cy="422" r="3.8"/>
      <circle cx="386" cy="422" r="3.8"/>
      <circle cx="356" cy="579" r="3.8"/>
      <circle cx="524" cy="579" r="3.8"/>
    </g>
  </g>

  <g data-kind="sacred tree">
    <path d="M496.0,686.0 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0" fill="none" stroke="#EDE3B8" stroke-width="2.4" stroke-dasharray="3 2"/>
    <text x="563.2" y="687.9" text-anchor="middle" font-size="7" font-style="italic" fill="#3A4A28">sacred tree</text>
    <line x1="541.0" y1="686.0" x2="515.0" y2="686.0" stroke="#3A4A28" stroke-width="0.60" stroke-linecap="round" data-leader="1"/>
  </g>

  <!-- Scale bar (3 px = 1 ft), below the grove -->
  <g data-kind="-">
    <g stroke="#3A2E1C">
      <line x1="254" y1="858" x2="344" y2="858" stroke-width="2"/>
      <line x1="254" y1="853" x2="254" y2="863" stroke-width="2"/>
      <line x1="344" y1="853" x2="344" y2="863" stroke-width="2"/>
      <line x1="299" y1="855" x2="299" y2="861" stroke-width="1"/>
    </g>
    <text x="299" y="874" text-anchor="middle" font-size="10" fill="#3A2E1C">30 ft</text>
    <text x="299" y="885" text-anchor="middle" font-size="8" font-style="italic" fill="#5C4830">(3 px = 1 ft)</text>
  </g>
</svg>
