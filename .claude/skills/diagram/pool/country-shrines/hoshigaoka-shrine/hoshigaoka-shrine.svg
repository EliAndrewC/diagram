<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 60 560 640" font-family="Georgia, 'Times New Roman', serif">
  <!-- ============================================================ -->
  <!-- Hoshigaoka Country Shrine - top-down diagrammatic plan          -->
  <!-- North at top; the approach enters from the village, south.     -->
  <!-- 3 px = 1 ft. The country shrine's program: buildings/programs.md -->
  <!-- ============================================================ -->
  <defs>
    <!-- Swept gravel of the shrine precinct (keidai): pale, with faint rake lines -->
    <pattern id="keidai-gravel" patternUnits="userSpaceOnUse" width="16" height="16">
      <rect width="16" height="16" fill="#E6DCC4"/>
      <line x1="0" y1="4" x2="16" y2="4" stroke="#D2C4A4" stroke-width="0.5"/>
      <line x1="0" y1="12" x2="16" y2="12" stroke="#D2C4A4" stroke-width="0.5"/>
      <circle cx="9" cy="8" r="0.5" fill="#C9B884"/>
    </pattern>
    <!-- Kitchen garden stipple -->
    <pattern id="garden-stipple" patternUnits="userSpaceOnUse" width="14" height="14">
      <rect width="14" height="14" fill="#BFCFA0"/>
      <circle cx="3" cy="3" r="0.8" fill="#7A8C5C"/>
      <circle cx="10" cy="9" r="0.8" fill="#7A8C5C"/>
    </pattern>
    <!-- Bare ground of the burial yard -->
    <pattern id="bare-earth" patternUnits="userSpaceOnUse" width="16" height="16">
      <rect width="16" height="16" fill="#D9C9A6"/>
      <circle cx="5" cy="7" r="0.6" fill="#B9A67E"/>
      <circle cx="12" cy="3" r="0.6" fill="#B9A67E"/>
    </pattern>
  </defs>

  <!-- Outer land -->
  <rect x="0" y="0" width="900" height="800" fill="#EFE3C2"/>

  <!-- The village lane arriving at the arch from the south (runs off the sheet) -->
  <g>
    <path d="M 365 700 L 365 612" stroke="#B89060" stroke-width="30" stroke-linecap="butt" opacity="0.55"/>
    <path d="M 365 700 L 365 612" stroke="#9C7448" stroke-width="30" stroke-dasharray="12 10" fill="none" opacity="0.4"/>
  </g>

  <!-- Title block -->
  <text x="440" y="92" text-anchor="middle" font-size="26" font-weight="bold" fill="#3A2E1C">Hoshigaoka Country Shrine</text>
  <text x="440" y="112" text-anchor="middle" font-size="12" font-style="italic" fill="#6B4F2A">the shrine of Hoshigaoka village district</text>

  <!-- Scale bar (3 px = 1 ft), top-left -->
  <g>
    <g stroke="#3A2E1C">
      <line x1="166" y1="86" x2="256" y2="86" stroke-width="2"/>
      <line x1="166" y1="81" x2="166" y2="91" stroke-width="2"/>
      <line x1="256" y1="81" x2="256" y2="91" stroke-width="2"/>
      <line x1="211" y1="83" x2="211" y2="89" stroke-width="1"/>
    </g>
    <text x="211" y="102" text-anchor="middle" font-size="10" fill="#3A2E1C">30 ft</text>
    <text x="211" y="113" text-anchor="middle" font-size="8" font-style="italic" fill="#5C4830">(3 px = 1 ft)</text>
  </g>

  <!-- The sacred wood around the precinct (chinju no mori): canopy outside the fence, west and north -->
  <g fill="#7A8C5C" stroke="#5C6E44" stroke-width="0.8" opacity="0.85">
    <circle cx="178" cy="180" r="18"/><circle cx="172" cy="222" r="16"/><circle cx="184" cy="262" r="19"/><circle cx="170" cy="304" r="15"/>
    <circle cx="182" cy="344" r="18"/><circle cx="172" cy="386" r="16"/><circle cx="186" cy="428" r="19"/><circle cx="172" cy="470" r="15"/>
    <circle cx="184" cy="512" r="18"/><circle cx="174" cy="554" r="16"/><circle cx="186" cy="594" r="17"/>
    <circle cx="222" cy="136" r="17"/><circle cx="262" cy="130" r="15"/><circle cx="302" cy="136" r="18"/><circle cx="344" cy="130" r="15"/>
    <circle cx="386" cy="136" r="18"/><circle cx="428" cy="130" r="15"/><circle cx="470" cy="136" r="17"/><circle cx="512" cy="132" r="15"/>
    <circle cx="552" cy="140" r="17"/><circle cx="556" cy="182" r="15"/><circle cx="560" cy="224" r="16"/>
    <circle cx="560" cy="500" r="15"/><circle cx="556" cy="540" r="17"/><circle cx="558" cy="582" r="15"/>
  </g>
  <text x="176" y="624" text-anchor="middle" font-size="9" font-style="italic" fill="#4A5C34">grove</text>

  <!-- The burial yard beside the precinct, outside the fence to the east: rows of grave markers on bare ground -->
  <rect x="580" y="250" width="100" height="220" fill="url(#bare-earth)" stroke="#B9A67E" stroke-width="0.8" stroke-dasharray="3 3"/>
  <g fill="#8A8478" stroke="#5C5850" stroke-width="0.5">
    <rect x="592" y="264" width="6" height="3"/><rect x="606" y="264" width="6" height="3"/><rect x="620" y="264" width="6" height="3"/><rect x="634" y="264" width="6" height="3"/><rect x="648" y="264" width="6" height="3"/><rect x="662" y="264" width="6" height="3"/>
    <rect x="592" y="286" width="6" height="3"/><rect x="606" y="286" width="6" height="3"/><rect x="620" y="286" width="6" height="3"/><rect x="634" y="286" width="6" height="3"/><rect x="648" y="286" width="6" height="3"/>
    <rect x="592" y="308" width="6" height="3"/><rect x="606" y="308" width="6" height="3"/><rect x="620" y="308" width="6" height="3"/><rect x="634" y="308" width="6" height="3"/><rect x="648" y="308" width="6" height="3"/><rect x="662" y="308" width="6" height="3"/>
    <rect x="592" y="330" width="6" height="3"/><rect x="606" y="330" width="6" height="3"/><rect x="620" y="330" width="6" height="3"/><rect x="634" y="330" width="6" height="3"/>
    <rect x="592" y="352" width="6" height="3"/><rect x="606" y="352" width="6" height="3"/><rect x="620" y="352" width="6" height="3"/><rect x="634" y="352" width="6" height="3"/><rect x="648" y="352" width="6" height="3"/>
    <rect x="592" y="374" width="6" height="3"/><rect x="606" y="374" width="6" height="3"/><rect x="620" y="374" width="6" height="3"/>
    <rect x="592" y="396" width="6" height="3"/><rect x="606" y="396" width="6" height="3"/><rect x="620" y="396" width="6" height="3"/><rect x="634" y="396" width="6" height="3"/>
    <rect x="592" y="418" width="6" height="3"/><rect x="606" y="418" width="6" height="3"/>
  </g>
  <text x="630" y="490" text-anchor="middle" font-size="9" font-style="italic" fill="#4A4640">burial ground</text>

  <!-- THE PRECINCT: swept gravel inside the fence (110 x 150 ft) -->
  <rect x="200" y="150" width="330" height="450" fill="url(#keidai-gravel)" id="precinct"/>
  <!-- The fence (tamagaki): a low paling all round, broken at the south for the arch -->
  <g id="fence" stroke="#7A6A4A" stroke-width="2" fill="none" stroke-linecap="square">
    <line x1="200" y1="150" x2="530" y2="150"/>
    <line x1="200" y1="150" x2="200" y2="600"/>
    <line x1="530" y1="150" x2="530" y2="600"/>
    <line x1="200" y1="600" x2="345" y2="600"/>
    <line x1="385" y1="600" x2="530" y2="600"/>
  </g>

  <!-- The approach (sando): a 10 ft gravel way from the arch to the hall's front step -->
  <rect x="350" y="404" width="30" height="196" fill="#D9CFB4" stroke="#C4B48E" stroke-width="0.8" id="approach"/>

  <!-- The arch (torii) over the approach where the way crosses the fence: two posts and a lintel, 12 ft span -->
  <rect x="347" y="588" width="36" height="24" fill="none" id="arch"/>
  <g fill="#A03020" stroke="#6B2A18" stroke-width="0.8">
    <rect x="347" y="592" width="4" height="20"/>
    <rect x="379" y="592" width="4" height="20"/>
    <rect x="345" y="588" width="40" height="3"/>
    <rect x="348" y="595" width="34" height="2"/>
  </g>

  <!-- The purification well beside the approach, east of it, never on it -->
  <rect x="396" y="470" width="22" height="22" fill="#9C8C70" stroke="#5C4830" stroke-width="1.2" id="well"/>
  <circle cx="407" cy="481" r="6" fill="#3A3A34"/>

  <!-- THE HALL AND DWELLING under one roof (76 x 36 ft): the villagers' hall at the front, on the axis; the monk's rooms behind and to the ends -->
  <rect x="251" y="292" width="228" height="108" fill="#DDB87A" stroke="#5A3F1E" stroke-width="2" id="hall"/>
  <!-- the villagers' hall: the front room centered on the approach, with its raised step -->
  <g stroke="#6B4F2A" stroke-width="1" stroke-dasharray="4 3" fill="none">
    <line x1="305" y1="292" x2="305" y2="400"/>
    <line x1="425" y1="292" x2="425" y2="400"/>
    <line x1="251" y1="326" x2="479" y2="326"/>
  </g>
  <rect x="305" y="400" width="120" height="6" fill="#E8D2A8" stroke="#6B4F2A" stroke-width="0.8"/>
  <text x="365" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#3A2E1C">hall and dwelling</text>
  <text x="365" y="384" text-anchor="middle" font-size="8" font-style="italic" fill="#5C4830">the villagers' hall, before the sanctuary</text>
  <text x="278" y="342" text-anchor="middle" font-size="8" font-style="italic" fill="#5C4830">the monk's</text>
  <text x="278" y="353" text-anchor="middle" font-size="8" font-style="italic" fill="#5C4830">rooms</text>
  <text x="452" y="342" text-anchor="middle" font-size="8" font-style="italic" fill="#5C4830">writing room</text>
  <text x="452" y="353" text-anchor="middle" font-size="8" font-style="italic" fill="#5C4830">(the registers)</text>
  <text x="372" y="322" text-anchor="middle" font-size="8" font-style="italic" fill="#5C4830">kitchen (earthen floor)</text>
  <!-- the hearth, well inside the kitchen floor -->
  <rect x="318" y="306" width="8" height="8" fill="#3A2010"/>
  <circle cx="322" cy="310" r="1.6" fill="#E08A30"/>

  <!-- THE SANCTUARY (honden): one bay, 6 ft square, on the axis behind the hall, on its plinth -->
  <rect x="352" y="246" width="26" height="4" fill="#B8AE98" stroke="#7A7060" stroke-width="0.6"/>
  <rect x="356" y="226" width="18" height="18" fill="#C9876C" stroke="#6B2A18" stroke-width="1.4" id="sanctuary"/>
  <text x="365" y="218" text-anchor="middle" font-size="8" font-style="italic" fill="#6B2A18">sanctuary of the rice Fortune</text>

  <!-- The privy at the dwelling's back corner, and the kitchen garden at the west end -->
  <rect x="254" y="274" width="15" height="15" fill="#7E726A" stroke="#4A3318" stroke-width="0.8"/>
  <text x="261" y="270" text-anchor="middle" font-size="7" font-style="italic" fill="#4A4640">privy</text>
  <rect x="207" y="300" width="38" height="66" fill="url(#garden-stipple)" stroke="#7A8C5C" stroke-width="1" stroke-dasharray="3 2" id="kitchen_garden"/>
  <text x="234" y="378" text-anchor="middle" font-size="7" font-style="italic" fill="#3A4A28">kitchen garden</text>

  <!-- Fire-water tubs at the hall's front corners and the kitchen end (gutter-fed, against the wall) -->
  <g fill="#8FB0C6" stroke="#3A5060" stroke-width="1">
    <circle cx="258" cy="407" r="3.8"/>
    <circle cx="472" cy="407" r="3.8"/>
    <circle cx="486" cy="299" r="3.8"/>
  </g>
  <text x="494" y="415" font-size="7" font-style="italic" fill="#3A5060">fire-water tubs</text>
</svg>
