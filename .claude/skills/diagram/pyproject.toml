# Lint + format + type + test + coverage config for the diagram skill's Python.
# One gate command runs them all: `make done` -> ruff check + ruff format --check + pyrefly + pytest
# (100% coverage). Wired so Constitution Principle X is enforced for the whole skill, not missed.
#
# Principle X (feature 005, GM-directed 2026-07-13): the Mode B engine (settlement.py,
# waterfields.py) is brought to FULL compliance - no grace period. ruff lint +
# format apply now; typing is pyrefly with the mypy-strict rule set (feature 142; the per-module
# mypy ratchet that preceded it is fully retired - every engine module is strict).

# ---- ruff (lint + format) ----------------------------------------------------------------
[tool.ruff]
target-version = "py314"
# The engine uses intentionally long, descriptive single-line check calls; 200 keeps `ruff format`
# from wrapping them (only ~17 lines exceed it) while still normalizing spacing/comments.
line-length = 200
# BOTH POOL TREES. A map generator is a script formatted by its own author, not engine source -
# and for the FROZEN tree this is load-bearing rather than stylistic (feature 161): those 18
# exhibits are committed write-once, so `ruff format .` and `ruff check --fix .` - which the
# gate runs, in place, without failing - would silently rewrite artifacts that can never be
# faithfully regenerated. Measured 2026-08-30 with the tree named but this list not yet
# updated: 18 files would be reformatted and 16 lint errors auto-fixed. `legacy-hand-authored-pool`
# does not match the pattern `pool`, so the new tree had to be named here explicitly.
extend-exclude = ["pool", "legacy-hand-authored-pool"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]   # long descriptive lines are house style; the formatter caps wrapping via line-length

[tool.ruff.lint.per-file-ignores]
# the package __init__ re-exports the overlap taxonomy and matrix surface via star
# imports (feature 027, superseding 024's verbatim roster): F403 because the stars ARE the
# re-export mechanism there, F401 for the aliased explicit block
"l7r/diagram/overlap/__init__.py" = ["F401", "F403"]
# same rationale for the settlement package split (feature 025)
"l7r/diagram/settlement/__init__.py" = ["F401"]
# the _geom package split (feature 117) re-exports its surface the 027 way rather than with a
# roster (Principle X clause 14): F403 because the stars ARE the mechanism, F401 for the aliased
# block that carries the six underscore names a star import cannot
"l7r/diagram/settlement/_geom/__init__.py" = ["F401", "F403"]
# same star-import re-export mechanism for the waterfields package split (feature 110)
"l7r/diagram/waterfields/__init__.py" = ["F401", "F403"]
# same again for the hamletgen package split (feature 111), plus E402: this __init__ runs a
# sys.path bootstrap BEFORE its imports, because every submodule imports `settlement` and
# `waterfields` by absolute name and the package must work when run from anywhere
"l7r/diagram/hamletgen/__init__.py" = ["E402", "F401", "F403"]

[tool.ruff.format]
# Preserve the existing quote style: the SVG f-strings use single-outer/double-inner
# (f'<rect fill="{c}"/>'), so leaving quotes as-authored avoids needless churn/risk.
quote-style = "preserve"

# ---- pyrefly (the type checker the gate runs - feature 142) ------------------------------
# pyrefly (Meta, Rust) is THE type checker (feature 142, GM 2026-08-28): a full cold check of the engine
# is ~0.6 s with nothing resident, where mypy needed 12.7 s cold or a 400-600 MB daemon per clone to
# reach 0.13 s (specs/142-rust-type-checker/research.md R2). ty (Astral) was measured too and is as
# fast, but has no rule for a missing annotation - the property the project's strict discipline
# rests on (R3) - so pyrefly. mypy is GONE (the GM, 2026-08-28: "get rid of mypy now completely") -
# not in the lockfiles, no mypy config block; `project-includes` below is the one list of checked files.
#
# `l7r` is a PEP 420 namespace portion (feature 119) - no `__init__.py`, deliberately, so that the
# webapp's `l7r.app` and this engine's `l7r.diagram.*` share one parent package. `search-path = ["."]`
# says where module paths begin, so each file has exactly one identity. Do NOT "fix" this by adding
# `l7r/__init__.py` - that silently hides the webapp's portion (tests/test_namespace_portion.py).
# boto3 ships no type information and is absent from the BUILD image on purpose (the build talks to
# S3 through the AWS CLI), hence `replace-imports-with-any` below.
[tool.pyrefly]
python-version = "3.14"
search-path = ["."]                      # `l7r` is a namespace portion: module roots start here
project-includes = ["l7r/diagram/settlement", "l7r/diagram/overlap", "l7r/diagram/waterfields", "l7r/diagram/hamletgen", "l7r/diagram/sitegen", "l7r/diagram/ci", "l7r/diagram/switches.py", "l7r/diagram/compound.py", "l7r/diagram/citybudget.py", "l7r/diagram/tools/pack_audit.py", "l7r/diagram/tools/why_placed.py", "l7r/diagram/tools/scatter_audit.py", "l7r/diagram/tools/timings.py", "l7r/diagram/tools/perf_bands.py", "l7r/diagram/tools/perf_review.py", "l7r/diagram/tools/perf_profile.py", "l7r/diagram/pipeline/pool_index.py", "l7r/diagram/pipeline/poolmaps.py"]
replace-imports-with-any = ["boto3", "boto3.*", "botocore", "botocore.*"]

# The mypy-strict rule set, enabled by NAME rather than pyrefly's `strict` preset: that preset also
# turns on implicit-any-lambda (167 hits) and implicit-any-empty-container (163) which mypy strict
# never asked for (research R3). Each rule here is the flag mypy --strict used to set:
[tool.pyrefly.errors]
unannotated-parameter = true      # disallow_untyped_defs / disallow_incomplete_defs
unannotated-return = true         # disallow_untyped_defs
unannotated-attribute = true      # (class attributes; stricter than mypy was - 0 hits)
implicit-any-type-argument = true # disallow_any_generics
no-any-return-implicit = true     # warn_return_any
unused-ignore = true              # warn_unused_ignores

# ---- pytest + coverage -------------------------------------------------------------------
[tool.pytest.ini_options]
# testpaths pins collection to tests/ - without it pytest walks the whole skill dir (and, from
# the repo root, every .clones/ checkout: pytest does not read .gitignore).
testpaths = ["tests"]
addopts = "--cov --cov-report=term"
# `rolls_map` marks a test that GENERATES a settlement - the thing that costs 25-110 s each and sets
# the whole suite's wall clock. `make quick` deselects them; `make done` runs everything.
#
# WHY A MARKER AND NOT A DESELECT LIST (feature 127): `quick` used to name two FILES and claim in its
# own output that "the map-rolling tests are NOT included". That was false - the three polder tests
# in test_water.py roll maps and cost 110 s, 86 s and 63 s, and they ran every time. A file list
# cannot track which tests roll maps; a marker travels with the test, and tests/test_markers.py
# fails if a map-rolling test is missing one.
markers = [
    "rolls_map: generates a settlement; slow (25-110 s). Deselected by `make quick`, run by `make done`.",
    # `coverage_only` (GM 2026-08-26, the make quick profile): a test that exists to CARRY LINE COVERAGE -
    # it replays a frozen fixture through the full gate so 33 deep statements execute - proves nothing
    # `make quick` measures (quick runs --no-cov), and its four cases were the four longest tests in the
    # quick set (9.0 / 5.4 / 3.4 / 3.2 s), the 9 s one alone being the run's critical path on 22 workers.
    # Deselected by `make quick`; `make done` runs them under coverage where they earn their keep.
    "coverage_only: replays a fixture through the full gate purely as a coverage carrier. Deselected by `make quick`, run by `make done`.",
    # `tiers(...)` (GM 2026-08-26, feature 133 T17): the settlement tiers a test is RELEVANT to - a test that
    # exercises a town/city/capital-only feature proves nothing about the hamlet on the sheet while scope is
    # locked to the reference hamlet. Untagged = relevant to every tier. Under `scope reference` the suite
    # runs with `--tier hamlet` and skips tests whose tiers exclude it (719 functions on 2026-08-26, tagged by
    # a scripted first pass over the tier names each test's body mentions; hamlet and village share the
    # homestead engine, so a test naming either stays in). The long-run idea, recorded in docs/iteration-loop.md:
    # derive relevance from the DIFF since the last green run instead of from hand tags.
    "tiers(*names): the settlement tiers this test is relevant to (hamlet, village, town, city, capital). Untagged = all. `--tier X` deselects tests whose tiers exclude X.",
    # `tooling` (GM 2026-08-26, T22): a test that exercises the Makefile, the scripts, the ci dispatcher, the
    # pipeline or the invocation guard by RUNNING them (make in a fixture, git repos in tmp, coverage subprocesses).
    # Skipped by `make quick` while the tooling files are unchanged since the last green `make done` (the state
    # file records their hash); always run at the gate. "no reason to run a five-CPU-second test to validate the
    # makefile behavior if we don't make any changes to the makefile itself."
    "tooling: exercises the make/ci/pipeline tooling by running it. Skipped by quick when the tooling is unchanged since the last green gate; always run at the gate.",
]

[tool.coverage.run]
# MODULE names, not directories, deliberately: `tools` and `pipeline` also hold modules that are
# not under the 100% rule (the by-hand audits and drivers - cache_audit, cohort_audit, crop_map,
# timings, make_regressions, gencache, regen). Naming the measured modules one by one keeps that
# boundary explicit instead of making a new tool silently owe 100% coverage the day it lands.
source = ["l7r.diagram._invocation", "l7r.diagram.switches", "l7r.diagram.ci", "l7r.diagram.overlap", "l7r.diagram.settlement", "l7r.diagram.hamletgen", "l7r.diagram.sitegen", "l7r.diagram.waterfields", "l7r.diagram.interactive", "l7r.diagram.compound", "l7r.diagram.citybudget", "l7r.diagram.tools.pack_audit", "l7r.diagram.tools.scatter_audit", "l7r.diagram.tools.perf_bands", "l7r.diagram.tools.perf_review", "l7r.diagram.tools.hamlet_floor", "l7r.diagram.pipeline.rollcache", "l7r.diagram.pipeline.render_cache", "l7r.diagram.pipeline.pool_index", "l7r.diagram.pipeline.poolmaps"]
# `waterfields` and `interactive` joined the measured set with feature 145: both are on the hamlet path (the field
# engine, the interactive page) and the derived floor (tools/hamlet_floor.py) judges every hamlet-path module, so
# every one of them has to be MEASURED - a module coverage never traced would pass the floor as an empty row.
# Map generators are not measured code. Depths follow the per-map folders (feature 161), and the
# frozen tree is named because it left `pool/` entirely.
omit = ["*/tests/*", "pool/*/*/*.gen.py", "legacy-hand-authored-pool/*/*/*.gen.py"]

# COVERAGE ENFORCEMENT LIVES IN THE MAKEFILE since the 2026-08-16 legacy freeze, not here. The
# hand-authored pool maps are frozen and their gens never run, so the above-hamlet wings of
# settlement.py (towns, cities, the capital) are exercised by nothing until those tiers convert to
# scripted generation. A single global `fail_under = 100` therefore cannot hold; the Makefile's
# `test` target enforces 100% on every module EXCEPT settlement.py and a RATCHET floor on
# settlement.py (raise it as tiers convert - see the comment there). `show_missing` stays off so
# settlement.py's known hole does not print a screen of line ranges on every run; for the module
# you are editing, `python3 -m coverage report -m --include='*/<file>'` after a suite run, and a
# failed gate still prints exactly the changed-but-uncovered lines via uncovered-in-diff.py.
[tool.coverage.report]
show_missing = false
exclude_also = [
    "if __name__ == .__main__.:",   # script entry guards are exercised via the CLI, not unit tests
]
