# The guards on Claude Code's tool calls, one process an event (feature 449 phase 1, `specs/449-rust-codebase/plan.md`).
[package]
name = "l7r_guard"
version = "0.1.0"
edition = "2021"
publish = false

# What the tests read of the tree at run time (feature 449 T93): the guards' tests read the recorded command corpora (tests/hooks/fixtures/),
# the Makefile's recipes and the hooks' helpers under scripts/. A change there runs them again.
[package.metadata.l7r]
reads = ["tests/hooks/", "Makefile", "scripts/"]

[lib]
name = "l7r_guard"

[dependencies]
# the hook protocol's JSON, read and written (feature 449 plan, Complexity Tracking: the one crate phase 1 adds)
serde = "1"
# `float_roundtrip`: floats read as Python's `json.loads` reads them, the workspace's set (feature 449 T139, `rust/Cargo.toml`)
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# the guards' patterns, 43 of them with lookaround or backreferences (research R8)
fancy-regex = "0.14"

[[bin]]
name = "l7r-guard"
path = "src/main.rs"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
too_many_lines = "deny"
allow_attributes_without_reason = "deny"
