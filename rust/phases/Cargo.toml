# The rebuilt hamlet stages (feature 444 FR-010) and the driver that rolls a hamlet through them with no Python (T42,
# `src/bin/hamlet.rs`); the counters behind the `counters` feature (D9, FR-012). The PyO3 doors went with the Python engine (T39).
[package]
name = "l7r_phases"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "l7r_phases"
crate-type = ["rlib"]

[features]
counters = []

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
too_many_lines = "deny"
allow_attributes_without_reason = "deny"

# THE TESTS AND THE COVERAGE RUN BUILT OPTIMIZED (the GM 2026-11-07: "There's no way anything should be running for that
# long"): unoptimized, the crate's own tests took about 17.6 minutes (measured 2026-11-07, `make rust-test`), most of it the
# row seating's geometry; `cargo test` and `cargo llvm-cov` both build this profile, and llvm-cov instruments before optimizing
[profile.dev]
opt-level = 2
