# The gate's own tools (feature 449 phase 2, `specs/449-rust-codebase/plan.md`): what `make done`, `make land` and the push decide, ported from Python piece by piece.
# The binary `l7r-gate` over the gate's crates (`crates/*`, feature 449 T92): this crate only dispatches.
[package]
name = "l7r_gate"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "l7r_gate"

[dependencies]
fancy-regex = { workspace = true }
l7r_gate_core = { path = "crates/core" }
l7r_guard = { path = "../guard" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
l7r_gate_core = { path = "crates/core", features = ["testkit"] }

[[bin]]
name = "l7r-gate"
path = "src/main.rs"

[lints]
workspace = true
