# The gate's own tools (feature 449 phase 2, `specs/449-rust-codebase/plan.md`): what `make done`, `make land` and the push decide, ported from Python piece by piece.
# The binary `l7r-gate` over the gate's crates (`crates/*`, feature 449 T92): this crate only dispatches.
[package]
name = "l7r_gate"
version = "0.1.0"
edition = "2021"
publish = false

# What the tests read of the tree at run time (feature 449 T93): the binary's tests answer through `top()`, the repository, and read only the push credential's file (traced 2026-11-11 by the hook suites' read shim over a full test run, feature 449 T100; `.git` is git's own lookup, not the tree). A change there runs them again.
[package.metadata.l7r]
reads = ["development-secrets.ini"]

[lib]
name = "l7r_gate"

[dependencies]
fancy-regex = { workspace = true }
l7r_gate_arbiter = { path = "crates/arbiter" }
l7r_gate_bundle = { path = "crates/bundle" }
l7r_gate_checks = { path = "crates/checks" }
l7r_gate_ci = { path = "crates/ci" }
l7r_gate_claims = { path = "crates/claims" }
l7r_gate_cohort = { path = "crates/cohort" }
l7r_gate_core = { path = "crates/core" }
l7r_gate_measure = { path = "crates/measure" }
l7r_gate_owed = { path = "crates/owed" }
l7r_gate_plan = { path = "crates/plan" }
l7r_gate_downloads = { path = "crates/downloads" }
l7r_gate_record = { path = "crates/record" }
l7r_gate_reviews = { path = "crates/reviews" }
l7r_gate_rustc = { path = "crates/rustc" }
l7r_gate_tree = { path = "crates/tree" }
l7r_gate_trials = { path = "crates/trials" }
l7r_guard = { path = "../guard" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
l7r_gate_core = { path = "crates/core", features = ["testkit"] }

[[bin]]
name = "l7r-gate"
path = "src/main.rs"

[lints]
workspace = true
