# The gate's view of the tree (feature 449 T92): stamps, delta, state, hashing, exemptions, the lock, the ratchets.
[package]
name = "l7r_gate_tree"
version = "0.1.0"
edition = "2021"
publish = false

# What the tests read of the tree at run time (feature 449 T93): the stamp, delta and ratchet tests read the scripts and the ratchets of the real tree, and `top()` is the repository (traced 2026-11-11 by the hook suites' read shim over a full test run, feature 449 T100; `.git` is git's own lookup, not the tree). A change there runs them again.
[package.metadata.l7r]
reads = ["dev/ratchets.json", "scripts/"]

[dependencies]
fancy-regex = { workspace = true }
l7r_gate_core = { path = "../core" }
l7r_guard = { path = "../../../guard" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
l7r_gate_core = { path = "../core", features = ["testkit"] }

[lints]
workspace = true
