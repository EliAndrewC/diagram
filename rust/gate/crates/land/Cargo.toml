# The landing (feature 449 T121, T83's fifth slice, `ask:449-T83-scope`): `l7r-gate land` (`l7r-gate replay-owing` deleted by 449 T247).
[package]
name = "l7r_gate_land"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
fancy-regex = { workspace = true }
l7r_gate_claims = { path = "../claims" }
l7r_gate_cohort = { path = "../cohort" }
l7r_gate_core = { path = "../core" }
# a carried plan-review.json is merged in process (451 T292)
l7r_gate_plan = { path = "../plan" }
l7r_gate_reviews = { path = "../reviews" }
l7r_gate_task = { path = "../task" }
l7r_shared = { path = "../../../guard/shared" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
l7r_gate_core = { path = "../core", features = ["testkit"] }
# one feature set a library in every test build (feature 451 T325, `checks`' `guard_deps/feature_sets.rs`): named for `testkit` alone
l7r_gate_owed = { path = "../owed", features = ["testkit"] }
l7r_gate_registry = { path = "../registry", features = ["testkit"] }
l7r_gate_research = { path = "../research", features = ["testkit"] }

[lints]
workspace = true

# the landing alone's tests run the script itself (451 T88), and the bundle's the closing checks (451 T141)
[package.metadata.l7r]
reads = ["scripts/land-alone.sh", "scripts/gates/closing-checks.sh"]
