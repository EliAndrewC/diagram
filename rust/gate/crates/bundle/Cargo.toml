# The check bundles, the round marks, the owed tools' door (feature 449 T92's split).
[package]
name = "l7r_gate_bundle"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
fancy-regex = { workspace = true }
l7r_gate_core = { path = "../core" }
