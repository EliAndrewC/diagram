# The map's vocabulary (feature 449 T149, phase 4's S6 under `ask:449-phase4-slices` Q5): the kinds of `interactive/classes/` and
# `compound_kinds/` as a Rust registry, each kind's modal text read from its Markdown file under `assets/modals/`, the knob conditions and
# the title card's choices, and the two tools that read the registry (the push's entry-headings check, `make open-questions`). The
# Python registry stays the implementation for its Python importers (the page writer S7, the Mode A sheets S9-S11, the pipeline S12),
# frozen: an edit of it makes the same change here in the same commit, and `kinds/tests.rs` holds the two equal.
[package]
name = "l7r_gate_registry"
version = "0.1.0"
edition = "2021"
publish = false

# What the tests read of the tree at run time (feature 449 T93): the registry's equality with the Python classes it mirrors, and every
# kind's modal file present and parsed, are tests over the real tree; since 451 T187 a modal's Guesses references read their item tags
# from the record's pages, and the label test holds every reference and About to them.
[package.metadata.l7r]
reads = ["l7r/diagram/interactive/assets/", "research/questions/"]

[dependencies]
fancy-regex = { workspace = true }
l7r_gate_core = { path = "../core" }
l7r_gate_research = { path = "../research" }
l7r_shared = { path = "../../../guard/shared" }
serde_json = { workspace = true }

[features]
# every kind's modal file written minimal into a scratch tree, for the crates whose tests load the whole registry (the `owed` crate's
# entry-drift tests)
testkit = []

[dev-dependencies]
l7r_gate_core = { path = "../core", features = ["testkit"] }
# one feature set a library in every test build (feature 451 T325, `checks`' `guard_deps/feature_sets.rs`): named for `testkit` alone
l7r_gate_registry = { path = ".", features = ["testkit"] }
l7r_gate_research = { path = "../research", features = ["testkit"] }

[lints]
workspace = true
