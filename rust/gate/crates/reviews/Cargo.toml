# The review checks' tooling (feature 449 T92's split): `l7r-gate reviews`, `reviews-door`.
[package]
name = "l7r_gate_reviews"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
fancy-regex = { workspace = true }
l7r_gate_core = { path = "../core" }
l7r_guard = { path = "../../../guard" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
l7r_gate_core = { path = "../core", features = ["testkit"] }

[lints]
workspace = true
