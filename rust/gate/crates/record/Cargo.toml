# The research record's small tools and its dispatcher (feature 449 T92's split): `l7r-gate record <verb>`.
[package]
name = "l7r_gate_record"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
fancy-regex = { workspace = true }
l7r_gate_archive = { path = "../archive" }
l7r_gate_bundle = { path = "../bundle" }
l7r_gate_core = { path = "../core" }
l7r_gate_downloads = { path = "../downloads" }
l7r_gate_owed = { path = "../owed" }
l7r_gate_pages = { path = "../pages" }
l7r_gate_registry = { path = "../registry" }
l7r_gate_research = { path = "../research" }
l7r_gate_semantic = { path = "../semantic" }
l7r_gate_trials = { path = "../trials" }
l7r_gate_uncited = { path = "../uncited" }
l7r_shared = { path = "../../../guard/shared" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
l7r_gate_owed = { path = "../owed", features = ["testkit"] }
l7r_gate_core = { path = "../core", features = ["testkit"] }

[lints]
workspace = true
