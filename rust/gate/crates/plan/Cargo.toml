# The plan gates (feature 449 T92's split): `l7r-gate plan <verb>`.
[package]
name = "l7r_gate_plan"
version = "0.1.0"
edition = "2021"
publish = false

# What the tests read of the tree at run time (feature 449 T93): the plan's tests read the approach checklist, the plan template and the scripts over the real tree (traced 2026-11-11 by the hook suites' read shim over a full test run, feature 449 T100; `.git` is git's own lookup, not the tree). A change there runs them again.
[package.metadata.l7r]
reads = ["docs/approach-checklist.md", ".specify/templates/", "scripts/"]

[dependencies]
fancy-regex = { workspace = true }
l7r_gate_core = { path = "../core" }
l7r_gate_tree = { path = "../tree" }
l7r_guard = { path = "../../../guard" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
l7r_gate_core = { path = "../core", features = ["testkit"] }

[lints]
workspace = true
