# The Rust tools as one workspace (feature 449 T001): the hamlet stages (feature 444) and the guards (feature 449 phase 1), one
# crate a phase's tools, sharing one lockfile and the build profile below; `scripts/gates/rust_checks.py` checks each member.
# The gate is a binary over crates (feature 449 T92, the GM 2026-11-11): `gate/crates/*`, so an edit recompiles one crate and what
# depends on it, not all 74,199 lines. `browser` is the one browser crate (feature 449 T146, `ask:449-phase4-slices` Q4), its own
# binary `l7r-browser`: no gate or guard crate depends on it, so their builds never compile it. `embed` is the embedder (feature 449
# T138, `ask:449-phase4-slices` Q11), its own binary `l7r-embed` for the same reason: ONNX Runtime's bindings and the tokenizer stay out
# of the gate's and the guard's builds. `mode_a` is the Mode A engine (feature 449 T168, the engine port's step 1), its own binary
# `l7r-mode-a` for the same reason: the geometry and rendering crates it will pull stay out of the gate's and the guard's builds.
[workspace]
members = ["phases", "guard", "gate", "gate/crates/*", "browser", "embed", "mode_a"]
resolver = "2"

# ONE FEATURE SET FOR EVERY GATE CRATE (feature 449 T92): a gate crate names an outside dependency only as `{ workspace = true }`, so
# testing one crate never rebuilds what another built with other features. A crate of the gate names another by its `path`,
# which the Rust checks read to know what a crate depends on (`l7r-gate rust`, `rustc.rs`).
[workspace.dependencies]
fancy-regex = "0.14"
serde = "1"
# PINNED TO UNICODE 16.0 (feature 449 T145): `quote_verbatim`'s squeeze folds by NFC and NFKC, and 0.1.24's tables gave CPython 3.14.4's
# `unicodedata` (16.0.0) on every code point where 0.1.26 (a later Unicode) differed on 69 (observed 2026-11-16, scratchpad t145/encprobe)
unicode-normalization = "=0.1.24"
# FLOATS READ AS PYTHON READS THEM (feature 449 T139, `ask:449-phase3-remainder`): serde_json's default float parse is best effort, and
# it read 509 of 6,000 floats one place off where Python's `json.loads` reads the nearest double (observed 2026-11-13, method: the long
# floats of `pool/hamlets/kashikawa/kashikawa.json` and 3,000 random ones through `l7r-gate json-field`, against Python's `repr`); every
# port compared against its Python reads JSON, so `float_roundtrip` is on for all of them. The guard names the same set.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# AN XML PARSER FOR WHAT PYTHON READ WITH `xml.etree` (feature 449 T174): `make size-table`'s Python read the plan with `ET.fromstring`, which
# decodes entities and character references in an attribute, takes single quotes and refuses a sheet that is not well formed; the crate's
# own tokenizer (`mode_a/src/sheet.rs`, `interactive/sheet.py`'s) does none of that, so a plan that differs from it there would read
# otherwise. roxmltree has no dependencies; its accept-or-refuse matched expat's on 28 of 30 probed forms, the other two
# (`xmlns:p=""`, an undefined entity in an attribute under an external DTD) followed in `mode_a/src/etree.rs` (observed 2026-11-17,
# method: the same forms through CPython 3.14.4's `ET.fromstring` and roxmltree 0.20.0, scratchpad t174/xmlprobe).
# PINNED (feature 449 T174): `rust/Cargo.lock` is not tracked, and `mode_a/src/etree.rs` rests on this version's refusals and on where it
# places an unknown entity's error, so a later 0.20.x resolved by another clone could move what the size table accepts
roxmltree = "=0.20.0"
# A PURE-RUST GEOMETRY FOR WHAT PYTHON ASKED OF SHAPELY (feature 449 T175): the audit's garden sun (`mode_a/src/audit/sun.rs`,
# `pack_audit/sun.py`) unions each half hour's shadows and takes the bed's unshaded area; `geo`'s boolean ops (over `i_overlay`) do it
# with no C library. PINNED, as roxmltree is (`rust/Cargo.lock` is not tracked), and its overlay crate with it (`mode_a/Cargo.toml`):
# 0.33 asks rustc 1.88 and the toolchain is 1.87; the default features (a triangulator, a mesher, rayon's threads) are off, the sun
# asking none of them. Where its float area differs from GEOS's, the lit verdict it feeds is held exactly by the crate's lockstep
# (`mode_a/src/parse/lockstep_checks.rs`), the difference measured there.
geo = { version = "=0.32.0", default-features = false }
# the overlay crate `geo`'s boolean ops run on, pinned at the version 0.32.0 resolved to (observed 2026-11-17, `rust/Cargo.lock`): its
# integer snapping is what an area differs from GEOS's by, so a later 4.0.x could move what the lockstep measured
i_overlay = { version = "=4.0.7", default-features = false }

# THE COVERAGE BUILD'S CFG IS EXPECTED (feature 449 T116): `cargo llvm-cov` builds with `--cfg=coverage`, and a whole-tree test leaves that
# build by it
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
too_many_lines = "deny"
allow_attributes_without_reason = "deny"

# THE TESTS AND THE COVERAGE RUN BUILT OPTIMIZED (the GM 2026-11-07: "There's no way anything should be running for that
# long"): unoptimized, the crate's own tests took about 17.6 minutes (measured 2026-11-07, `make rust-test`), most of it the
# row seating's geometry; `cargo test` and `cargo llvm-cov` both build this profile, and llvm-cov instruments before optimizing
[profile.dev]
opt-level = 2
# LINE TABLES ONLY (feature 449 T96, measured 2026-11-11, scratchpad/t96/bench.py, each edit and its revert): full debug info made a
# gate crate's test binary 136 MB and its link 1.2-15 s under GNU ld; line tables keep a panic's file and line and the coverage
# report (llvm-cov reads its own mapping, not DWARF: claims' and core's reports the same line for line), and halved the target.
# `[profile.test]` inherits this; `release` and `tool` (the hamlet engine, l7r-gate, l7r-guard) do not.
debug = "line-tables-only"

# THE TOOLS BUILD INCREMENTALLY (feature 449 T95, the GM 2026-11-11, `request.md` "the Rust tooling's efficiency"): `l7r-gate`, `l7r-rust`
# and `l7r-guard` build this profile (`scripts/gates/l7r-gate.sh`, `scripts/hooks/l7r-guard.sh`), into `<target>/tool/`. Cargo's release
# default has incremental off, so a one-line edit of a gate crate rebuilt the whole binary: 38-45 s after core, 8-9 s after claims; with
# incremental on, 1.6-2.6 s for core, tree, plan, claims or owed, the tools' output byte for byte the same and their run times within noise
# (observed 2026-11-11, method: scratchpad/t95/bench.py, each edit and its revert). Do NOT add `codegen-units` (incremental already
# defaults to 256; measured the same), `lto = "off"` (no faster to build, 15-40% slower to run) or `opt-level = 1` (0.3-0.5 s off a
# rebuild, 30-60% slower to run). `[profile.release]` stays cargo's own: the hamlet engine's `cargo run --release` builds it.
[profile.tool]
inherits = "release"
incremental = true
